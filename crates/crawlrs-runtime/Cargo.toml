[package]
name        = "crawlrs-runtime"
description = "Pipeline orchestration for crawlrs: composes Frontier + Politeness + Fetcher + Parser + Store into a tokio worker pool."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true

[dependencies]
crawlrs-core.workspace = true

httpdate.workspace    = true
metrics.workspace     = true
thiserror.workspace   = true
# `fs` enabled here (on top of the workspace defaults
# rt-multi-thread/macros/time/sync) because the maintenance task
# reads `/proc/self/{status,fd}` for the periodic process-health log
# line. Without this feature `tokio::fs` is configured out and the
# crate fails to compile.
tokio = { workspace = true, features = ["fs"] }
tracing.workspace     = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

# For integration tests against a real Redis frontier + real politeness.
crawlrs-fetch.workspace          = true
crawlrs-frontier.workspace = true
crawlrs-politeness.workspace     = true
crawlrs-parse.workspace          = true
crawlrs-metadata.workspace       = true
crawlrs-store.workspace          = true
crawlrs-fakes.workspace        = true
metrics-util.workspace           = true

bb8.workspace                    = true
bb8-redis.workspace              = true
chrono.workspace                 = true
httpdate.workspace               = true
sqlx                             = { workspace = true }
testcontainers.workspace         = true
testcontainers-modules.workspace = true
cuid2.workspace                   = true

[lints]
workspace = true
