[package]
name        = "crawlrs-bin"
description = "The `crawlrs` CLI binary: clap surface, config loading, axum host for /metrics + health probes, maintenance loop, graceful shutdown. Wires every other workspace crate together."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true

[[bin]]
name = "crawlrs"
path = "src/main.rs"

[dependencies]
crawlrs-core.workspace           = true
crawlrs-fetch.workspace          = true
crawlrs-frontier.workspace = true
crawlrs-metadata.workspace       = true
crawlrs-parse.workspace          = true
crawlrs-politeness.workspace     = true
crawlrs-runtime.workspace        = true
crawlrs-store.workspace          = true

anyhow.workspace                       = true
axum.workspace                         = true
bb8.workspace                          = true
bb8-redis.workspace                    = true
clap.workspace                         = true
humantime-serde.workspace              = true
metrics-exporter-prometheus.workspace  = true
object_store.workspace                 = true
serde.workspace                        = true
sqlx.workspace                         = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "fs"] }
toml.workspace                         = true
tracing.workspace                      = true
tracing-subscriber.workspace           = true

# Replaces glibc malloc with jemalloc. Two wins: (1) more aggressive
# page return to the OS, which collapses the fragmentation spikes we
# can't otherwise explain; (2) `profiling` feature lets us dump a live
# heap profile via `jeprof` when MALLOC_CONF=prof:true,prof_active:true
# is set. Linux-only via cfg in main.rs - tikv-jemallocator doesn't
# compile on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
tempfile.workspace               = true
testcontainers.workspace         = true
testcontainers-modules.workspace = true

[lints]
workspace = true
