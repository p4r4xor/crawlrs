[package]
name        = "crawlrs-bin"
description = "The `crawlrs` CLI binary: clap surface, config loading, axum host for /metrics + health probes, maintenance loop, graceful shutdown. Wires every other workspace crate together."
version.workspace    = true
edition.workspace    = true
license.workspace    = true
repository.workspace = true
authors.workspace    = true

[[bin]]
name = "crawlrs"
path = "src/main.rs"

[dependencies]
crawlrs-core.workspace           = true
crawlrs-fetch.workspace          = true
crawlrs-frontier.workspace = true
crawlrs-metadata.workspace       = true
crawlrs-parse.workspace          = true
crawlrs-politeness.workspace     = true
crawlrs-runtime.workspace        = true
crawlrs-store.workspace          = true

anyhow.workspace                       = true
axum.workspace                         = true
bb8.workspace                          = true
bb8-redis.workspace                    = true
clap.workspace                         = true
humantime-serde.workspace              = true
metrics.workspace                      = true
metrics-exporter-prometheus.workspace  = true
object_store.workspace                 = true
serde.workspace                        = true
sqlx.workspace                         = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "fs"] }
toml.workspace                         = true
tracing.workspace                      = true
tracing-subscriber.workspace           = true

# Replaces glibc malloc with jemalloc on Linux. The motivating win is
# aggressive page-return-to-OS via jemalloc's `dirty_decay_ms` /
# `muzzy_decay_ms` purging defaults: for our many-small-short-lived
# allocation pattern (per-request scratch buffers, parser collections,
# TLS handshake state), glibc tends to hold freed pages in its arenas
# and inflate RSS even when live allocations have shrunk. jemalloc
# returns dirty pages aggressively, collapsing the VmData - RSS gap.
#
# `unprefixed_malloc_on_supported_platforms` exports jemalloc's
# `malloc` / `free` under the standard libc symbol names so the C
# dependencies (BoringSSL via btls-sys, lz4, snappy) also route
# through jemalloc - without it, jemalloc only sees Rust's `alloc`
# traffic and the C-side allocations stay on glibc.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.6", features = ["unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
tempfile.workspace               = true
testcontainers.workspace         = true
testcontainers-modules.workspace = true

[lints]
workspace = true
