# Sample crawlrs configuration. Copy to crawl.toml and edit.
#
# Every value below shows the default, and every section's keys are
# documented inline.

# Stable identifier for this crawl run. Stamped into Redis keys,
# Postgres rows, and the blob-store path layout. Pick something
# operator-friendly (a date range or campaign name).
run_id = "demo-2026-05"

# Redis backend for the frontier + politeness state.
[redis]
url = "redis://localhost:6379"
# bb8 connection pool size. Should be >= 2 * (workers per pod) so
# that politeness checks and frontier ops don't contend.
pool_size = 16

# Postgres backend for the metadata ledger (per-URL state, history, DLQ).
[postgres]
url = "postgres://crawlrs:crawlrs@localhost/crawlrs"
pool_size = 8

# HTTP fetcher knobs.
#
# `user_agent` is a single knob that controls both the wire User-Agent
# and the token used for robots.txt rule matching. Two coherent modes:
#
#   * Polite-bot (this example): `user_agent` is set to a stable
#     string. Sites can write rules for it in robots.txt; the
#     politeness layer's `obey_robots_txt = true` is allowed.
#   * Stealth: `user_agent` is unset. wreq's randomized emulation
#     profile drives the wire UA per request, so the TLS / HTTP/2
#     fingerprint stays coherent with whatever browser identity is
#     being advertised. Requires `[politeness].obey_robots_txt =
#     false` (validated at startup).
[fetch]
max_body_bytes  = 10485760  # 10 MB hard cap; rejects responses past this
default_timeout = "30s"
user_agent      = "crawlrs/0.0.1 (+https://github.com/p4r4xor/crawlrs)"

# Operator-mandated crawl scope: how deep to follow links and how
# many URLs to take per host. Distinct from `[politeness]` (which is
# behavior toward a host as a guest); scope describes your own
# crawl's shape. Both globals are unset by default = unbounded.
[crawl]
# max_depth = 5
# max_urls  = 50000

# Per-host scope overrides. Each entry adjusts max_depth / max_urls
# for one host. Keys are exact host strings (no eTLD+1 rollup;
# `docs.python.org` and `python.org` are distinct quotas).
# [crawl.per_domain."python.org"]
# max_depth = 3
# max_urls  = 1000

# Access control: hosts the crawler refuses to visit. Checked first,
# before robots.txt / rate / backoff.
[access]
# blocklist = ["example.com", "do-not-crawl.org"]

# Politeness layer: per-host delays, robots.txt, backoff.
#
# Coherence rule enforced at startup: obey_robots_txt = true requires
# [fetch].user_agent to be set. With random emulation (no fetch UA),
# the wire User-Agent rotates per request and can't be matched
# coherently against any robots.txt rule group.
#
# `enabled = false` is the master switch: the entire politeness layer
# is wired to no-op impls and the runtime sees a `Politeness` that
# allows every URL with no Redis I/O. Use only against infrastructure
# you own or with explicit permission. Scope (`[crawl]`) and access
# (`[access]`) controls remain active when politeness is disabled;
# they're separate concerns.
[politeness]
enabled         = true
host_delay      = "1s"
obey_robots_txt = true
robots_ttl      = "24h"

# Exponential backoff on 429 / 503 / transport errors.
[politeness.backoff]
initial_backoff   = "30s"
max_backoff       = "10m"
multiplier        = 2.0
failure_threshold = 10

# Per-host politeness overrides. Each entry can adjust host_delay,
# obey_robots_txt, and robots_ttl for that host without touching the
# global defaults. Keys are exact host strings.
# [politeness.per_domain."python.org"]
# host_delay = "5s"

# Worker pool + per-URL retry budget.
[runtime]
workers          = 4
max_retries      = 5      # after this many consecutive failures, URL -> DLQ

# Strategy for moving discovered outbound URLs into the Frontier.
#
# "direct" (default): worker calls Frontier::submit_batch directly
# after the metadata commit. A submit_batch failure or worker crash
# mid-call drops those outbound URLs. ~50x lower Postgres write rate
# than durable_outbox because outbound URLs never become rows in the
# outbox table. Watch crawlrs_direct_dispatch_lost_total; sustained
# non-zero loss is the signal to flip to durable_outbox.
#
# "durable_outbox": outbound URLs commit atomically with the metadata
# write into a Postgres outbox table; a separate publisher drains
# them into the Frontier with at-least-once delivery. Survives any
# single component crash; costs ~100x the per-fetch Postgres write
# rate (one row per outbound URL).
link_dispatch    = "direct"

# Per-shard Frontier knobs. Defaults are sized for the standard
# per-shard layout; raise `bloom_capacity` for runs expected to
# submit more than ~10M unique URLs. `bloom_fpr` governs the silent-
# drop budget at submit time (each false positive is a URL we never
# fetch); 0.1% is a sensible default for runs that re-crawl
# periodically.
[frontier]
lease_timeout             = "60s"       # crash-recovery floor
promoter_tick             = "50ms"      # wake -> ready / lease reclaim cadence
bloom_capacity            = 10_000_000  # ~18 MB at fpr=0.001
bloom_fpr                 = 0.001       # false-positive rate at capacity

# Output stores. Parquet is the analytical primary; WARC is the
# archival mirror that preserves the original HTTP wire framing. Both
# default true (data preservation + analytical queries). Disable
# parquet to save storage; disable warc to skip archival mirroring;
# disabling both is rejected at startup.
[store]
parquet     = true
warc        = true
base_prefix = "crawlrs"

# Rotation thresholds (per shard). The first trigger to fire closes
# the current file. Peak writer memory is ~(num_shards * max_bytes)
# since each shard buffers raw body bytes + per-row state in RAM
# until the file is uploaded; tune in concert with the pod memory
# limit.
[store.rotation]
max_bytes    = 134217728   # 128 MiB
max_rows     = 100000
max_duration = "30m"

# Object-store backend for both Parquet and WARC files.
# kind = "local" writes to a local directory (good for sandboxes).
# kind = "s3" writes to any S3-compatible service (AWS, MinIO, R2,
# GCS via S3 compat).
[store.backend]
kind = "local"
path = "/var/lib/crawlrs/data"

# S3 example (delete the [store.backend] block above and uncomment
# this one):
# [store.backend]
# kind                          = "s3"
# endpoint                      = "https://s3.us-east-1.amazonaws.com"
# bucket                        = "crawlrs-data"
# region                        = "us-east-1"
# access_key_id                 = "..."
# secret_access_key             = "..."
# allow_http                    = false
# virtual_hosted_style_request  = true

# HTTP host: /metrics + /healthz + /livez + /readyz. The k8s
# StatefulSet template wires liveness/readiness probes against this.
[server]
listen = "0.0.0.0:9090"

# Sharding policy. num_shards is the load-distribution unit; default
# is 8 (bounds hot-domain head-of-line blocking to one shard's worker
# capacity while staying small enough that one Redis instance can
# hold all per-shard state). owned_shards lets a process narrow its
# subset (useful in single-pod testing); leave unset to derive from
# POD_NAME ordinal in a StatefulSet deploy.
[sharding]
num_shards    = 8
# owned_shards = [0, 1, 2, 3, 4, 5, 6, 7]  # all 8 (single-pod default)
