# Sample crawlrs configuration. Copy to crawl.toml and edit.
#
# Every value below shows the default, and every section's keys are
# documented inline.

# Stable identifier for this crawl run. Stamped into Redis keys,
# Postgres rows, and the blob-store path layout. Pick something
# operator-friendly (a date range or campaign name).
run_id = "demo-2026-05"

# Redis backend for the frontier + politeness state.
[redis]
url = "redis://localhost:6379"
# bb8 connection pool size. Should be >= 2 * (workers per pod) so
# that politeness checks and frontier ops don't contend.
pool_size = 16

# Postgres backend for the metadata ledger (per-URL state, history,
# DLQ).
[postgres]
url = "postgres://crawlrs:crawlrs@localhost/crawlrs"
pool_size = 8

# HTTP fetcher knobs.
[fetch]
max_body_bytes  = 10485760  # 10 MB hard cap; rejects responses past this
user_agent      = "crawlrs/0.0.1 (+https://github.com/p4r4xor/crawlrs)"
default_timeout = "30s"

# Politeness layer: per-host delays, robots.txt, backoff.
[politeness]
min_delay        = "1s"
honor_robots_txt = true
robots_cache_ttl = "24h"
# user_agent here overrides the [fetch] one for robots.txt requests
# specifically. Most operators leave this commented; the [fetch]
# user_agent is reused.
# user_agent     = "crawlrs/0.0.1"

# Exponential backoff on 429 / 503 / transport errors.
[politeness.backoff]
initial_backoff             = "30s"
max_backoff                 = "10m"
multiplier                  = 2.0
circuit_open_after_failures = 10

# Hosts to never crawl (in addition to robots.txt).
# manual_excludes = ["example.com", "do-not-crawl.org"]

# Per-host overrides. Each entry can adjust min_delay and / or
# honor_robots_txt for that host without touching the global default.
# [politeness.per_domain."slow-host.example"]
# min_delay = "5s"

# Worker pool + per-URL retry budget.
[runtime]
workers          = 4
max_depth        = 5      # null/unset = unbounded
max_retries      = 5      # after this many consecutive failures, URL → DLQ
cross_run_dedup  = true   # skip URLs already succeeded in a prior run

# Output stores. Parquet is the analytical primary; WARC is the
# archival mirror that preserves the original HTTP wire framing. Both
# default true (data preservation + analytical queries). Disable
# parquet to save storage; disable warc to skip archival mirroring;
# disabling both is rejected at startup.
[store]
parquet     = true
warc        = true
base_prefix = "crawlrs"

# Object-store backend for both Parquet and WARC files.
# kind = "local" writes to a local directory (good for sandboxes).
# kind = "s3" writes to any S3-compatible service (AWS, MinIO, R2,
# GCS via S3 compat).
[store.backend]
kind = "local"
path = "/var/lib/crawlrs/data"

# S3 example (delete the [store.backend] block above and uncomment
# this one):
# [store.backend]
# kind                          = "s3"
# endpoint                      = "https://s3.us-east-1.amazonaws.com"
# bucket                        = "crawlrs-data"
# region                        = "us-east-1"
# access_key_id                 = "..."
# secret_access_key             = "..."
# allow_http                    = false
# virtual_hosted_style_request  = true

# HTTP host: /metrics + /healthz + /livez + /readyz. The k8s
# StatefulSet template wires liveness/readiness probes against this.
[server]
listen = "0.0.0.0:9090"

# Sharding policy. num_shards is the load-distribution unit; default
# is 8 (bounds hot-domain head-of-line blocking to one shard's worker
# capacity while staying small enough that one Redis instance can
# hold all per-shard state). owned_shards lets a process narrow its
# subset (useful in single-pod testing); leave unset to derive from
# POD_NAME ordinal in a StatefulSet deploy.
[sharding]
num_shards    = 8
# owned_shards = [0, 1, 2, 3, 4, 5, 6, 7]  # all 8 (single-pod default)
