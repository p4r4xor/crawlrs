# typos config. See https://github.com/crate-ci/typos.
#
# Run locally: `cargo install typos-cli` then `typos`.

[default]
extend-ignore-identifiers-re = [
    # cuid2 / generated IDs / hex hashes can include letter sequences
    # that look like typos.
    "[0-9a-f]{12,}",
]

[default.extend-words]
# Project-specific terms that look like misspellings to typos.
crawlrs = "crawlrs"
# "fpr" is the standard abbreviation for "false positive rate" in
# the Bloom-filter literature; it appears in config keys
# (`bloom_fpr`, `bloomFpr`), struct fields, and doc comments.
fpr = "fpr"
# AIMD = Additive Increase Multiplicative Decrease; standard
# congestion-control term used in the adaptive politeness layer.
AIMD = "AIMD"

[files]
extend-exclude = [
    "target/",
    "Cargo.lock",
    ".git/",
    "crates/*/benches/fixtures/",
    "local/seeds.txt",
]
