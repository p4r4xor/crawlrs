# Helm overrides for local kind deployment of charts/crawlrs-demo.
#
# Layered on top of charts/crawlrs-demo/values.yaml. The demo chart's
# defaults already wire Redis + Postgres at sandbox-shape; this file
# only changes what's specific to running on the developer's laptop:
# the image source and the crawler's runtime tuning.
#
# Apply with:
#   helm upgrade --install crawlrs-demo ./charts/crawlrs-demo \
#     --values local/values.local.yaml \
#     --set-file crawlrs.seeds.content=local/seeds.txt \
#     --create-namespace -n crawlrs
#
# The `make local-up` target does this for you.

crawlrs:
  # Use the locally-built image loaded into kind via
  # `kind load docker-image`. `pullPolicy: Never` keeps K8s from
  # trying to pull from the upstream registry (which we don't publish
  # to from this repo).
  image:
    repository: crawlrs
    tag: local
    pullPolicy: Never

  replicaCount: 1

  # Distinct run identifier per local-dev cycle. The Frontier prefixes
  # every shard-scoped key with `crawlrs:{<runId>_s<shard>}:<op>`, so
  # bumping this rolls the keyspace without `FLUSHALL`. The `seen` bloom
  # is deployment-wide and not affected.
  runId: "local"

  # Local dev: text logs are easier to eyeball than JSON.
  logFormat: text

  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 8000m
      memory: 2Gi

  runtime:
    workers: 320
    maxRetries: 5
    # Outbound URL dispatch strategy. "direct" = worker submits the
    # discovered URLs to the Frontier itself (loses URLs on transient
    # Frontier error). "durable_outbox" = URLs commit through a
    # Postgres outbox + publisher daemon (at-least-once). Local dev
    # uses "direct" - higher throughput, no publisher pod needed.
    linkDispatch: "direct"

  redis:
    poolSize: 384

  postgres:
    poolSize: 384

  # Operator-imposed crawl scope. Both `null` (= unbounded) by default;
  # local runs leave them unbounded so any seed list is fully expanded.
  # Per-host overrides via `crawl.perDomain.<host>.maxDepth/maxUrls`.
  crawl:
    maxDepth: null
    maxUrls: null
    perDomain: {}

  # Hosts the crawler refuses to visit. Checked first, before robots /
  # rate / backoff. Exact host strings; no eTLD+1 rollup.
  access:
    blocklist: []

  # Local sandbox won't see anywhere near the chart default of 10M
  # unique URLs per shard. Shrink the bloom 10x to reclaim ~84 MiB of
  # Redis memory (8 shards * ~10 MiB savings each).
  frontier:
    bloomCapacity: 1000000
    # Defaults from the chart - listed here so the tunable surface is
    # visible without having to flip between values files.
    bloomFpr: 0.001
    leaseTimeout: "60s"
    promoterTick: "50ms"

  # Demo chart redis sub-config: bump the pod memory limit and pair
  # with --maxmemory inside Redis (set in the redis statefulset).
  # The umbrella demo chart owns this; subchart overrides not used.

  fetch:
    maxBodyBytes: 5242880
    # Stealth mode: leaving userAgent unset so wreq's randomized emulation
    # profile drives the wire User-Agent. obeyRobotsTxt must be false
    # for this to validate (a random per-request UA can't coherently
    # match a robots.txt rule group).
    defaultTimeout: "60s"
    readTimeout: "30s"

  politeness:
    enabled: false
    hostDelay: "1s"
    obeyRobotsTxt: false
    robotsTtl: "24h"
    backoff:
      initialBackoff: "30s"
      maxBackoff: "10m"
      multiplier: 2.0
      failureThreshold: 10

  store:
    parquet: true
    warc: false
    basePrefix: "crawlrs"
    rotation:
      maxBytes: 16777216 # 16 MiB
      maxRows: 8000
      maxDuration: "5m"
    backend:
      kind: local
      path: /var/lib/crawlrs/data
      # persistence.enabled defaults to false (emptyDir; blobs LOST
      # on pod restart). Flip to true if you want crawled blobs to
      # survive restarts:
      # persistence:
      #   enabled: true
      #   size: 50Gi

  # Optional seed list. When `content` is non-empty, the chart renders
  # it into the same ConfigMap as crawl.toml (mounted at
  # /etc/crawlrs/seeds.txt) and spawns a one-shot `crawlrs seed` Job
  # via the `post-install` Helm hook. The Job loads the URLs into the
  # Frontier and exits; the StatefulSet itself never reads seeds, so
  # pod restarts do NOT re-trigger seed-loading.
  #
  # `make local-up` populates `content` via `--set-file` from
  # local/seeds.txt. To force a reseed after the initial install:
  #   helm install --replace crawlrs-demo ...
  # or `kubectl create job --from=job/<release>-crawlrs-seed reseed-...`.
  seeds:
    content: ""

  sharding:
    numShards: 8

  server:
    port: 9090
    listen: "0.0.0.0:9090"
    # Expose /metrics on host:9090 via the kind extraPortMappings.
    # Removes the need for `kubectl port-forward` (and the host-port
    # collisions that come with re-running it).
    localNodePort:
      enabled: true
      nodePort: 30090

  o11y:
    grafana:
      service:
        type: NodePort
        # Pairs with local/kind.yaml's hostPort 3000 -> nodePort 30300.
        nodePort: 30300
