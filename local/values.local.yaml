# Helm overrides for local kind deployment of charts/crawlrs-demo.
#
# Layered on top of charts/crawlrs-demo/values.yaml. The demo chart's
# defaults already wire Redis + Postgres at sandbox-shape; this file
# only changes what's specific to running on the developer's laptop:
# the image source and the crawler's runtime tuning.
#
# Apply with:
#   helm upgrade --install crawlrs-demo ./charts/crawlrs-demo \
#     --values local/values.local.yaml \
#     --set-file crawlrs.seeds.content=local/seeds.txt \
#     --create-namespace -n crawlrs
#
# The `make local-up` target does this for you.

crawlrs:
  # Use the locally-built image loaded into kind via
  # `kind load docker-image`. `pullPolicy: Never` keeps K8s from
  # trying to pull from the upstream registry (which we don't publish
  # to from this repo).
  image:
    repository: crawlrs
    tag: local
    pullPolicy: Never

  replicaCount: 1

  # Resource asks scaled for a developer laptop. The crawler itself
  # is mostly IO-bound; bump cpu.limit if you increase `runtime.workers`
  # well past 50 and watch CPU saturation in Grafana.
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 2000m
      memory: 2Gi

  runtime:
    # Starting low to find the memory ceiling on this laptop. Each
    # worker holds a tokio task + Redis/PG connection pools + lol_html
    # parser state (~30-50MB at peak). 50 workers OOM'd at the 2Gi
    # limit; ramp up after the stack comes up cleanly.
    workers: 10
    maxDepth: 4
    maxRetries: 5
    crossRunDedup: true

  fetch:
    maxBodyBytes: 5242880  # 5 MiB; truncate larger bodies
    userAgent: "crawlrs-local/0.0.1 (+https://github.com/p4r4xor/crawlrs)"
    defaultTimeout: "30s"

  politeness:
    hostDelay: "1s"
    obeyRobotsTxt: true
    robotsTtl: "24h"
    backoff:
      initialBackoff: "30s"
      maxBackoff: "10m"
      multiplier: 2.0
      circuitOpenAfterFailures: 10

  store:
    parquet: true
    warc: false  # Disable archival mirror locally to halve disk usage;
                 # flip on for research-mode runs that need byte-exact
                 # HTTP wire framing preserved.
    backend:
      kind: local
      path: /var/lib/crawlrs/data
      # persistence.enabled defaults to false (emptyDir; blobs LOST
      # on pod restart). Flip to true if you want crawled blobs to
      # survive restarts:
      # persistence:
      #   enabled: true
      #   size: 50Gi

  # Optional seed list rendered into the same ConfigMap as crawl.toml
  # and passed to the binary as `--seeds /etc/crawlrs/seeds.txt`. The
  # `make local-up` target populates this via `--set-file` from
  # local/seeds.txt; production deployments load the frontier
  # externally and leave this empty.
  seeds:
    content: ""

  sharding:
    numShards: 8

  server:
    port: 9090
    listen: "0.0.0.0:9090"
