[workspace]
members = ["crates/*"]
resolver = "3"

[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level      = 3
lto            = "fat"
codegen-units  = 1
strip          = true
# No `panic = "abort"`: the runtime supervisor catches worker-task
# panics via JoinSet and respawns them; aborting would escalate one
# worker panic into a whole-process kill.

[workspace.lints.rust]
unsafe_code      = "deny"
unreachable_pub  = "warn"

[workspace.lints.clippy]
all         = { level = "warn", priority = -1 }
# Correctness lints are almost always real bugs; deny them outright.
# (Default priority 0 overrides the `all = warn` group above.)
correctness = "deny"

[workspace.package]
version     = "0.0.1"
edition     = "2024"
license     = "GPL-3.0-only"
repository  = "https://github.com/p4r4xor/crawlrs"
authors     = ["Aniketh <p4r4xor@gmail.com>"]

[workspace.dependencies]
async-trait = "0.1"
bb8         = "0.9"
futures     = { version = "0.3", default-features = false, features = ["std", "async-await"] }
httpdate    = "1.0"
bb8-redis   = "0.26"
blake3      = { version = "1", default-features = false }
bytes       = "1"
chrono      = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
cuid2       = "0.1"
http        = "1"
humantime-serde = "1"
lol_html    = "2.8"
simdutf8    = "0.1"
moka        = { version = "0.12", features = ["sync"] }
arrow       = { version = "58", default-features = false }
parquet     = { version = "58", default-features = false, features = ["arrow", "zstd"] }
object_store = { version = "0.13", default-features = false, features = ["aws", "fs"] }
flate2      = "1"
metrics     = "0.24"
metrics-util = { version = "0.20", features = ["debugging"] }
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
clap        = { version = "4", features = ["derive", "env"] }
axum        = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
toml        = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
anyhow      = "1"
postcard    = { version = "1", features = ["use-std"] }
redis       = { version = "1.2", default-features = false, features = ["tokio-comp", "streams", "script"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
smallvec    = "1"
sqlx        = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "json"] }
texting_robots = "0.2"
thiserror   = "2"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing     = "0.1"
url         = { version = "2", features = ["serde"] }

# Pinned exactly: these are prereleases and the API breaks between RCs,
# so an upgrade is a deliberate edit rather than whatever `cargo update`
# resolves. wreq's default features carry `tokio-rt` (the async runtime)
# and `webpki-roots` (the fallback trust store), so defaults stay on.
wreq        = { version = "=6.0.0-rc.29", features = ["gzip", "brotli", "zstd", "deflate", "socks", "stream", "hickory-dns"] }
wreq-util   = { version = "=3.0.0-rc.14", default-features = false, features = ["emulation"] }

# Test-only.
testcontainers         = "0.27"
testcontainers-modules = { version = "0.15", features = ["redis", "postgres"] }
tempfile               = "3"
criterion              = { version = "0.8", features = ["html_reports"] }

# Workspace-internal crates (referenced from sub-crates by name).
crawlrs-core            = { path = "crates/crawlrs-core",            version = "0.0.1" }
crawlrs-fetch           = { path = "crates/crawlrs-fetch",           version = "0.0.1" }
crawlrs-parse           = { path = "crates/crawlrs-parse",           version = "0.0.1" }
crawlrs-frontier  = { path = "crates/crawlrs-frontier",  version = "0.0.1" }
crawlrs-politeness      = { path = "crates/crawlrs-politeness",      version = "0.0.1" }
crawlrs-runtime         = { path = "crates/crawlrs-runtime",         version = "0.0.1" }
crawlrs-metadata        = { path = "crates/crawlrs-metadata",        version = "0.0.1" }
crawlrs-store           = { path = "crates/crawlrs-store",           version = "0.0.1" }
crawlrs-fakes           = { path = "crates/crawlrs-fakes",           version = "0.0.1" }
