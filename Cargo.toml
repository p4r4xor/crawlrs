[workspace]
members = ["crates/*"]
resolver = "3"

# Lint config inherited by every crate via `[lints] workspace = true`.
# Tier 1 baseline: warn-level clippy::all, deny unsafe. CI runs with
# `-D warnings` so any clippy hit fails the build; locally devs see
# them as warnings to keep the inner loop fast.
[workspace.lints.rust]
unsafe_code      = "deny"
unreachable_pub  = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.package]
version     = "0.0.1"
edition     = "2024"
license     = "GPL-3.0-only"
repository  = "https://github.com/p4r4xor/crawlrs"
authors     = ["Aniketh <p4r4xor@gmail.com>"]

[workspace.dependencies]
async-trait = "0.1"
bb8         = "0.9"
futures     = { version = "0.3", default-features = false, features = ["std", "async-await"] }
httpdate    = "1.0"
bb8-redis   = "0.26"
bytes       = "1"
chrono      = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
cuid2       = "0.1"
http        = "1"
humantime-serde = "1"
lol_html    = "2.8"
moka        = { version = "0.12", features = ["sync"] }
arrow       = { version = "54", default-features = false }
parquet     = { version = "54", default-features = false, features = ["arrow", "zstd"] }
object_store = { version = "0.11", default-features = false, features = ["aws"] }
flate2      = "1"
metrics     = "0.24"
metrics-util = { version = "0.18", features = ["debugging"] }
metrics-exporter-prometheus = { version = "0.16", default-features = false, features = ["http-listener"] }
clap        = { version = "4", features = ["derive", "env"] }
axum        = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
toml        = "0.8"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
anyhow      = "1"
postcard    = { version = "1", features = ["use-std"] }
redis       = { version = "1.2", default-features = false, features = ["tokio-comp", "streams"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
sqlx        = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "json"] }
texting_robots = "0.2"
thiserror   = "2"
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
tracing     = "0.1"
url         = { version = "2", features = ["serde"] }
wreq        = { version = "=6.0.0-rc.28", features = ["gzip", "brotli", "zstd", "deflate", "socks", "stream"] }
wreq-util   = "=3.0.0-rc.10"

# Test-only.
testcontainers         = "0.27"
testcontainers-modules = { version = "0.15", features = ["redis", "postgres"] }
tempfile               = "3"

# Workspace-internal crates (referenced from sub-crates by name).
crawlrs-core            = { path = "crates/crawlrs-core",            version = "0.0.1" }
crawlrs-fetch           = { path = "crates/crawlrs-fetch",           version = "0.0.1" }
crawlrs-parse           = { path = "crates/crawlrs-parse",           version = "0.0.1" }
crawlrs-frontier-redis  = { path = "crates/crawlrs-frontier-redis",  version = "0.0.1" }
crawlrs-politeness      = { path = "crates/crawlrs-politeness",      version = "0.0.1" }
crawlrs-runtime         = { path = "crates/crawlrs-runtime",         version = "0.0.1" }
crawlrs-metadata        = { path = "crates/crawlrs-metadata",        version = "0.0.1" }
crawlrs-store           = { path = "crates/crawlrs-store",           version = "0.0.1" }
crawlrs-bin             = { path = "crates/crawlrs-bin",             version = "0.0.1" }
crawlrs-fakes           = { path = "crates/crawlrs-fakes",           version = "0.0.1" }
