# cargo-deny config. See https://embarkstudios.github.io/cargo-deny/ for the full schema.
#
# Run locally: `cargo install --locked cargo-deny` then `cargo deny check`.

[graph]
all-features = true

# ---------------------------------------------------------------------------
# Security advisories (RustSec DB)
# ---------------------------------------------------------------------------
[advisories]
version    = 2
yanked     = "warn"
ignore     = [
    # `paste` is unmaintained per RUSTSEC-2024-0436. It's pulled in
    # transitively via parquet; the advisory is "no longer
    # maintained", not a vulnerability. The recommended drop-in
    # replacement (`pastey`) is at version 0.2.x while parquet
    # requires `paste = "1.0"`, so cargo's `[patch.crates-io]` won't
    # substitute across the major-version gap without us forking
    # pastey to publish a 1.x. Track until parquet itself migrates.
    "RUSTSEC-2024-0436",
    # `atomic-polyfill` is unmaintained per RUSTSEC-2023-0089. It's
    # pulled in transitively via `postcard -> heapless 0.7`. heapless
    # 0.8 dropped the dep, but postcard 1.1.x (the latest) still pins
    # heapless 0.7 for backward compat. Track until postcard
    # migrates; advisory is unmaintained-only, not a vulnerability.
    "RUSTSEC-2023-0089",
]
db-path    = "~/.cargo/advisory-db"
db-urls    = ["https://github.com/RustSec/advisory-db"]

# ---------------------------------------------------------------------------
# License policy
# ---------------------------------------------------------------------------
#
# Globally allowed: permissive licenses that are compatible with most
# distribution scenarios and don't impose copyleft obligations.
# A license that's only used by a small set of named crates lives in
# `[[licenses.exceptions]]` below, not here, so a future dep can't
# silently arrive under the same license without explicit review.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# Per-crate license exceptions. Each entry opts a single crate
# into a license not in the global allow list. Adding a new
# exception is a deliberate, reviewable act; a future dep that
# brings in the same license without an entry here will still
# fail the deny check.
#
# crawlrs is GPL-3.0-only. The 10 workspace crates inherit the
# license from `[workspace.package]` (`license.workspace = true`)
# and are each listed below. We don't blanket-allow GPL-3.0-only
# globally so a third-party GPL dep would still be flagged here
# instead of slipping in under our own project's license.

[[licenses.exceptions]]
name = "crawlrs-bin"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "crawlrs-core"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "crawlrs-fakes"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "crawlrs-fetch"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "crawlrs-frontier"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "crawlrs-metadata"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "crawlrs-parse"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "crawlrs-politeness"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "crawlrs-runtime"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "crawlrs-store"
allow = ["GPL-3.0-only"]

# tiny-keccak: pulled in transitively via ahash -> const-random ->
# const-random-macro (used by arrow, parquet, cuid2, wreq, schnellru).
# CC0-1.0 is a public-domain dedication; FSF Free/Libre. The
# exception is on tiny-keccak specifically rather than allowing CC0
# globally so any other dep arriving under CC0 surfaces here for
# review.
[[licenses.exceptions]]
name = "tiny-keccak"
allow = ["CC0-1.0"]

# ---------------------------------------------------------------------------
# Crate bans / duplicates
# ---------------------------------------------------------------------------
[bans]
multiple-versions  = "warn"
wildcards          = "deny"
highlight          = "all"
deny               = []

# Duplicate-version allowlist. Every entry below comes from an
# upstream transitive split we do not control directly. Most are
# either platform-specific (windows-*, wasi*, redox_*) or driven by
# major-version splits inside a few core crate families that
# upstream has not yet collapsed:
#
#   - sqlx 0.8 pulls older revisions of crypto / windows-sys / hashbrown
#     via the sqlx-postgres -> etcetera -> hkdf chain.
#   - parquet + arrow pull newer crypto / hashbrown / thiserror.
#   - ring + rustls pull a separate windows-sys / wasi axis.
#   - wreq + hickory pull rand 0.10 alongside getrandom 0.4 / wasip3.
#   - testcontainers + bollard pull rand 0.9 alongside getrandom 0.3.
#   - moka + uuid pull yet another rand axis.
#
# None of these touch our runtime decisions; they exist purely
# because the upstream crates haven't aligned. Listed by name
# without a version pin so a future upstream bump (which collapses
# the dupe) silently disappears from this list rather than needing
# a manual edit. A NEW crate that gets duplicated (not on this list)
# still surfaces as a warning so we notice.
skip = [
    { name = "block-buffer" },
    { name = "core-foundation" },
    { name = "cpufeatures" },
    { name = "crypto-common" },
    { name = "digest" },
    { name = "foldhash" },
    { name = "getrandom" },
    { name = "hashbrown" },
    { name = "itertools" },
    { name = "ordered-float" },
    { name = "rand" },
    { name = "rand_chacha" },
    { name = "rand_core" },
    { name = "redox_syscall" },
    { name = "r-efi" },
    { name = "regex-automata" },
    { name = "thiserror" },
    { name = "thiserror-impl" },
    { name = "windows-sys" },
    { name = "windows-targets" },
    { name = "windows_aarch64_gnullvm" },
    { name = "windows_aarch64_msvc" },
    { name = "windows_i686_gnu" },
    { name = "windows_i686_msvc" },
    { name = "windows_x86_64_gnu" },
    { name = "windows_x86_64_gnullvm" },
    { name = "windows_x86_64_msvc" },
    { name = "wit-bindgen" },
]
skip-tree          = []

# ---------------------------------------------------------------------------
# Sources (crates.io + git)
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git      = "warn"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
