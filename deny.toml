# cargo-deny config. See https://embarkstudios.github.io/cargo-deny/ for the full schema.
#
# Run locally: `cargo install --locked cargo-deny` then `cargo deny check`.

[graph]
all-features = true

# ---------------------------------------------------------------------------
# Security advisories (RustSec DB)
# ---------------------------------------------------------------------------
[advisories]
version    = 2
yanked     = "warn"
ignore     = []
db-path    = "~/.cargo/advisory-db"
db-urls    = ["https://github.com/RustSec/advisory-db"]

# ---------------------------------------------------------------------------
# License policy
# ---------------------------------------------------------------------------
[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# ---------------------------------------------------------------------------
# Crate bans / duplicates
# ---------------------------------------------------------------------------
[bans]
multiple-versions  = "warn"
wildcards          = "deny"
highlight          = "all"
deny               = []
skip               = []
skip-tree          = []

# ---------------------------------------------------------------------------
# Sources (crates.io + git)
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git      = "warn"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
