apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "crawlrs-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ .Release.Name }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "crawlrs-demo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "crawlrs-demo.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      # redis-stack-server's image runs as uid 1000 by default;
      # fsGroup makes the mounted volume writable for that uid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          imagePullPolicy: {{ .Values.redis.imagePullPolicy | quote }}
          # RDB-only durability. Three save thresholds give a
          # progressively-sparser snapshot cadence:
          #   `save 60 10000`  - every 60s if >=10k keys changed
          #   `save 300 10`    - every 5min if >=10 keys changed
          #   `save 900 1`     - every 15min if >=1 key changed
          # AOF is disabled. RedisBloom state survives RDB snapshots,
          # so the bloom's cross-run dedup substrate survives pod
          # restarts.
          # Each `--save SECONDS CHANGES` pair must be its own pair of
          # argv tokens; Redis CLI parses them positionally.
          args:
            - redis-server
            - --appendonly
            - "no"
            - --save
            - "60"
            - "10000"
            - --save
            - "300"
            - "10"
            - --save
            - "900"
            - "1"
            - --dir
            - /data
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "crawlrs-demo.labels" . | nindent 10 }}
          app.kubernetes.io/component: redis
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size | quote }}
