apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redis
  labels:
    {{- include "crawlrs-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: {{ .Release.Name }}-redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "crawlrs-demo.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "crawlrs-demo.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      # redis-stack-server's image runs as uid 1000 by default;
      # fsGroup makes the mounted volume writable for that uid.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          imagePullPolicy: {{ .Values.redis.imagePullPolicy | quote }}
          # redis-stack-server uses a custom entrypoint that runs
          # `redis-server --loadmodule .../redisbloom.so ...` so the
          # bloom + JSON + search modules are present at startup.
          # We must NOT override `args:` here; doing so replaces
          # that entrypoint and Redis comes up without modules, so
          # the frontier's `BF.RESERVE` would fail with "unknown
          # command". Customise via `REDIS_ARGS` instead; the
          # entrypoint appends it to its own arg list.
          #
          # RDB-only durability. Three save thresholds give a
          # progressively-sparser snapshot cadence:
          #   `save 60 10000`  - every 60s if >=10k keys changed
          #   `save 300 10`    - every 5min if >=10 keys changed
          #   `save 900 1`     - every 15min if >=1 key changed
          # AOF is disabled. RedisBloom state survives RDB snapshots,
          # so the bloom's cross-run dedup substrate survives pod
          # restarts.
          #
          # Sandbox-only: `--protected-mode no` allows cross-pod
          # connections from the crawler / publisher. With no
          # password set, Redis would otherwise refuse non-loopback
          # commands. Production deploys should set a password and
          # pass it in the connection URL instead.
          env:
            # `--maxmemory` is Redis's own ceiling: at this point Redis
            # returns OOM error to writers instead of growing further.
            # Combined with `--maxmemory-policy noeviction`, NO key is
            # ever evicted - the OOM signal flows back to the crawler
            # which treats failed submits as bloom-marked drops. Set
            # to ~80% of the pod's memory limit so RDB snapshot COW
            # has headroom.
            - name: REDIS_ARGS
              value: "--protected-mode no --appendonly no --save 60 10000 --save 300 10 --save 900 1 --dir /data --maxmemory 1600mb --maxmemory-policy noeviction"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
        # redis_exporter sidecar. Connects to Redis on localhost
        # (same pod), scrapes INFO + CLIENT LIST + CONFIG, and serves
        # Prometheus-shaped metrics on :9121/metrics. vmsingle scrapes
        # the metrics port via the redis Service (see the o11y
        # scrape configmap).
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.83.0
          imagePullPolicy: IfNotPresent
          env:
            - name: REDIS_ADDR
              value: "redis://localhost:6379"
          ports:
            - name: metrics
              containerPort: 9121
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "crawlrs-demo.labels" . | nindent 10 }}
          app.kubernetes.io/component: redis
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size | quote }}
