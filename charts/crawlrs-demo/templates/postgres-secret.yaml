apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres
  labels:
    {{- include "crawlrs-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  # Consumed by the postgres pod (POSTGRES_USER / POSTGRES_PASSWORD /
  # POSTGRES_DB env). The full postgres URL goes into the crawlrs
  # Secret separately (see crawlrs subchart's secrets.values.postgresUrl).
  user: {{ .Values.postgresql.credentials.user | quote }}
  password: {{ .Values.postgresql.credentials.password | quote }}
  database: {{ .Values.postgresql.credentials.database | quote }}
