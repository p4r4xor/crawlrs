apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-minio
  labels:
    {{- include "crawlrs-demo.labels" . | nindent 4 }}
    app.kubernetes.io/component: minio
type: Opaque
stringData:
  # Consumed by the minio pod (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD)
  # and by the bucket-init Job (mc alias set credentials).
  rootUser: {{ .Values.minio.credentials.rootUser | quote }}
  rootPassword: {{ .Values.minio.credentials.rootPassword | quote }}
