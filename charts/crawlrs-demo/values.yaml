# crawlrs-demo: sandbox values for the all-in-one chart.
#
# IMPORTANT: install with release name `crawlrs-demo`:
#
#   helm install crawlrs-demo ./charts/crawlrs-demo --create-namespace -n crawlrs
#
# The Service-DNS hostnames the crawlrs subchart references include
# the release name. A different release name means overriding
# `crawlrs.redis.url` and `crawlrs.postgres.url` to match.
#
# Local sandbox stores blobs on a pod-local filesystem (kind=local).
# For a production deploy use the prod chart at `charts/crawlrs/`
# directly with `--set store.backend.kind=s3` and your own bucket /
# region / credentials.

# ---- Redis Stack (official upstream image) --------------------------
# The frontier requires the RedisBloom module for submit-time dedup;
# stock `redis:7-alpine` lacks `BF.RESERVE`. `redis-stack-server`
# bundles RedisBloom + RedisJSON + RediSearch + RedisTimeSeries on top
# of stock Redis.
redis:
  image: redis/redis-stack-server:7.4.0-v0
  imagePullPolicy: IfNotPresent
  # RDB-only durability: snapshot at progressively-sparser thresholds
  # so frequent writes flush often, idle periods still snapshot
  # eventually. AOF is intentionally disabled (the bloom-filter state
  # survives via RDB; AOF replay's per-op overhead isn't worth it for
  # this workload). `make local-cluster-down` wipes the PVC; `helm
  # uninstall` keeps it.
  persistence:
    size: 5Gi
  # Memory limit covers Redis working set: per-shard host queues +
  # wake/ready/inflight ZSETs + URL HASH + the RedisBloom filter
  # (~1.8 MB per 1M URLs at fpr=0.001). 2Gi gives Redis room to hit
  # its own `--maxmemory 1600mb` ceiling (in the statefulset
  # template) and still leave headroom for RDB snapshot COW.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# ---- Postgres (official upstream image) -----------------------------
postgresql:
  image: postgres:17.2-alpine
  imagePullPolicy: IfNotPresent
  credentials:
    user: crawlrs
    # Demo password baked into a Secret. Override in any non-sandbox
    # use; never commit a real password here.
    password: crawlrs
    database: crawlrs
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# ---- crawlrs subchart override --------------------------------------
crawlrs:
  runId: "demo"
  replicaCount: 1

  redis:
    url: "redis://crawlrs-demo-redis:6379"
    poolSize: 8

  postgres:
    url: "postgres://crawlrs:crawlrs@crawlrs-demo-postgres:5432/crawlrs"
    poolSize: 4

  store:
    parquet: true
    warc: true
    backend:
      kind: local
      path: /var/lib/crawlrs/data
      # persistence.enabled defaults to false (emptyDir, blobs LOST on
      # pod restart). Flip to true for a PVC-backed volume that
      # survives restarts; size below applies to both modes.

  # Demo creds rendered into the chart's Secret. Swap for
  # externally-managed secrets in production via charts/crawlrs/.
  secrets:
    create: true
    values:
      redisUrl: "redis://crawlrs-demo-redis:6379"
      postgresUrl: "postgres://crawlrs:crawlrs@crawlrs-demo-postgres:5432/crawlrs"
      # S3 creds left empty: kind=local doesn't read them. Populate
      # only if switching to kind=s3 against real S3.
      s3AccessKeyId: ""
      s3SecretAccessKey: ""

  runtime:
    workers: 2
    maxDepth: 3

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # The bundled o11y stack is on by default; values inherit from the
  # subchart. Smaller resource asks for sandbox-shape.
  o11y:
    enabled: true
    vmsingle:
      storage:
        size: 1Gi
      retentionPeriod: 7d
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      # Demo bundles a redis_exporter sidecar in its Redis pod; enable
      # the scrape job pointing at the metrics port on the Redis svc.
      redisExporter:
        enabled: true
        target: "{{ .Release.Name }}-redis:9121"
    grafana:
      adminPassword: admin
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
