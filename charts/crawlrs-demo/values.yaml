# crawlrs-demo: sandbox values for the all-in-one chart.
#
# IMPORTANT: install with release name `crawlrs-demo`:
#
#   helm install crawlrs-demo ./charts/crawlrs-demo --create-namespace -n crawlrs
#
# The Service-DNS hostnames the crawlrs subchart references include
# the release name. A different release name means overriding
# `crawlrs.redis.url` and `crawlrs.postgres.url` to match.
#
# Local sandbox stores blobs on a pod-local filesystem (kind=local).
# For a production deploy use the prod chart at `charts/crawlrs/`
# directly with `--set store.backend.kind=s3` and your own bucket /
# region / credentials.

# ---- Redis (official upstream image) --------------------------------
redis:
  image: redis:7.4.2-alpine
  imagePullPolicy: IfNotPresent
  # AOF persistence on by default. `make local-cluster-down` (kind
  # delete) wipes the PVC; `helm uninstall` keeps it.
  persistence:
    size: 5Gi
  # Memory limit needs headroom for Redis to load AOF on startup
  # plus working set (seen-set hash, frontier streams). 256Mi caused
  # OOMKill on restart with ~200MB of persisted state.
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ---- Postgres (official upstream image) -----------------------------
postgresql:
  image: postgres:17.2-alpine
  imagePullPolicy: IfNotPresent
  credentials:
    user: crawlrs
    # Demo password baked into a Secret. Override in any non-sandbox
    # use; never commit a real password here.
    password: crawlrs
    database: crawlrs
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# ---- crawlrs subchart override --------------------------------------
crawlrs:
  runId: "demo"
  replicaCount: 1

  redis:
    url: "redis://crawlrs-demo-redis:6379"
    poolSize: 8

  postgres:
    url: "postgres://crawlrs:crawlrs@crawlrs-demo-postgres:5432/crawlrs"
    poolSize: 4

  store:
    parquet: true
    warc: true
    backend:
      kind: local
      path: /var/lib/crawlrs/data
      # persistence.enabled defaults to false (emptyDir, blobs LOST on
      # pod restart). Flip to true for a PVC-backed volume that
      # survives restarts; size below applies to both modes.

  # Demo creds rendered into the chart's Secret. Swap for
  # externally-managed secrets in production via charts/crawlrs/.
  secrets:
    create: true
    values:
      redisUrl: "redis://crawlrs-demo-redis:6379"
      postgresUrl: "postgres://crawlrs:crawlrs@crawlrs-demo-postgres:5432/crawlrs"
      # S3 creds left empty: kind=local doesn't read them. Populate
      # only if switching to kind=s3 against real S3.
      s3AccessKeyId: ""
      s3SecretAccessKey: ""

  runtime:
    workers: 2
    maxDepth: 3

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # The bundled o11y stack is on by default; values inherit from the
  # subchart. Smaller resource asks for sandbox-shape.
  o11y:
    enabled: true
    vmsingle:
      storage:
        size: 1Gi
      retentionPeriod: 7d
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    grafana:
      adminPassword: admin
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
