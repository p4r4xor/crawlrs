# crawlrs-demo: sandbox values for the all-in-one chart.
#
# IMPORTANT: install with release name `crawlrs-demo`:
#
#   helm install crawlrs-demo ./charts/crawlrs-demo --create-namespace -n crawlrs
#
# The Service-DNS hostnames the crawlrs subchart references below
# include the release name. A different release name means overriding
# `crawlrs.redis.url`, `crawlrs.postgres.url`, and
# `crawlrs.store.backend.s3.endpoint` to match.

# ---- Redis (official upstream image) --------------------------------
redis:
  image: redis:7.4.2-alpine
  imagePullPolicy: IfNotPresent
  # AOF persistence on by default. `make local-cluster-down` (kind
  # delete) wipes the PVC; `helm uninstall` keeps it.
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ---- Postgres (official upstream image) -----------------------------
postgresql:
  image: postgres:17.2-alpine
  imagePullPolicy: IfNotPresent
  credentials:
    user: crawlrs
    # Demo password baked into a Secret. Override in any non-sandbox
    # use; never commit a real password here.
    password: crawlrs
    database: crawlrs
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

# ---- MinIO (official upstream image) --------------------------------
minio:
  image: minio/minio:RELEASE.2024-11-07T00-52-20Z
  # `mc` client image used by the bucket-init Job. Pinned to a
  # release close to the server image so client/server protocol
  # versions match.
  mcImage: minio/mc:RELEASE.2024-11-05T11-29-45Z
  imagePullPolicy: IfNotPresent
  credentials:
    rootUser: minioadmin
    rootPassword: minioadmin
  bucket: crawlrs-data
  persistence:
    size: 50Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# ---- crawlrs subchart override --------------------------------------
# Wires the crawler at the bundled-service DNS names rendered by our
# raw manifests below. Service names are
# `<release>-{redis,postgres,minio}` (so `crawlrs-demo-...`).
crawlrs:
  runId: "demo"
  replicaCount: 1

  redis:
    url: "redis://crawlrs-demo-redis:6379"
    poolSize: 8

  postgres:
    url: "postgres://crawlrs:crawlrs@crawlrs-demo-postgres:5432/crawlrs"
    poolSize: 4

  store:
    parquet: true
    warc: true
    backend:
      kind: s3
      s3:
        endpoint: "http://crawlrs-demo-minio:9000"
        bucket: "crawlrs-data"
        region: "us-east-1"
        allowHttp: true
        virtualHostedStyleRequest: false

  # Demo creds rendered into the chart's Secret. Swap for
  # externally-managed secrets in production via charts/crawlrs/
  # directly.
  secrets:
    create: true
    values:
      redisUrl: "redis://crawlrs-demo-redis:6379"
      postgresUrl: "postgres://crawlrs:crawlrs@crawlrs-demo-postgres:5432/crawlrs"
      s3AccessKeyId: "minioadmin"
      s3SecretAccessKey: "minioadmin"

  runtime:
    workers: 2
    maxDepth: 3

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # The bundled o11y stack is on by default; values inherit from the
  # subchart. Smaller resource asks for sandbox-shape.
  o11y:
    enabled: true
    vmsingle:
      storage:
        size: 1Gi
      retentionPeriod: 7d
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    grafana:
      adminPassword: admin
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 250m
          memory: 256Mi
