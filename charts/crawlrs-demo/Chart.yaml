apiVersion: v2
name: crawlrs-demo
description: |
  Sandbox wrapping `charts/crawlrs/` with bundled Redis + Postgres
  using official upstream images. Blob storage is pod-local FS
  (`store.backend.kind = local`). One `helm install crawlrs-demo`
  produces a fully self-contained crawlrs deployment - useful for
  evaluating the crawler, dev loops, and CI smoke tests. Not
  production-shaped: single replicas, fixed credentials, sandbox-sized
  PVCs.

  For production the prod chart at `charts/crawlrs/` is the artefact;
  it expects operators to bring their own Redis / Postgres / S3 (e.g.
  managed cloud services or in-cluster operators) and to flip
  `store.backend.kind = s3`.
type: application

version: 0.0.1
appVersion: "0.0.1"

home: https://github.com/p4r4xor/crawlrs
sources:
  - https://github.com/p4r4xor/crawlrs

keywords:
  - crawler
  - sandbox
  - demo

maintainers:
  - name: p4r4xor
    url: https://github.com/p4r4xor

# Only the local crawlrs chart is a subchart dependency. Redis and
# Postgres are deployed via raw manifests in
# `templates/{redis,postgres}-*.yaml` using official upstream images
# directly (no third-party chart in the supply chain). Blob storage
# is pod-local FS in the sandbox; production uses S3-compatible
# storage configured on the prod chart directly.
dependencies:
  - name: crawlrs
    version: 0.1.0
    repository: "file://../crawlrs"
