# Default values for the crawlrs chart. Override via
# `helm install ... -f my-values.yaml` or `--set key=val`.
#
# Required overrides for any non-trivial deploy:
#   redis.url, postgres.url, store.backend.*

# ---- Image -----------------------------------------------------------
image:
  repository: ghcr.io/p4r4xor/crawlrs
  # If empty, the chart uses Chart.appVersion as the tag.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# ---- Replicas + sharding --------------------------------------------
# The default sharding policy is HostHashShardPolicy(8): 8 shards
# bounds hot-domain head-of-line blocking to one shard's worker
# capacity while keeping per-shard memory small enough that one Redis
# instance can hold all per-shard state. replicaCount is independent:
# with N replicas + 8 shards, each pod owns shards
# (ordinal, ordinal + N, ...) per the binary's CRAWLRS_REPLICAS-aware
# logic in factory.rs.
replicaCount: 1

# ---- crawl.toml content ---------------------------------------------
# These values are rendered into the ConfigMap as crawl.toml. The
# binary reads /etc/crawlrs/crawl.toml at startup. Credentials live in
# the Secret and are env-var-overlaid (CRAWLRS_REDIS_URL,
# CRAWLRS_POSTGRES_URL).
runId: "demo"

redis:
  # Read from the Secret as CRAWLRS_REDIS_URL. Set this to point at
  # your Redis instance. `redis://...` URLs only; `redis-sentinel://`
  # is rejected at startup until v1.x.
  url: "redis://redis-master:6379"
  poolSize: 16

postgres:
  # Read from the Secret as CRAWLRS_POSTGRES_URL. `postgres://...`
  # connection string. Pool size sized to >= 2 * (workers per pod).
  url: "postgres://crawlrs:crawlrs@postgres:5432/crawlrs"
  poolSize: 8

fetch:
  maxBodyBytes: 10485760
  userAgent: "crawlrs/0.0.1 (+https://github.com/p4r4xor/crawlrs)"
  defaultTimeout: "30s"

politeness:
  minDelay: "1s"
  honorRobotsTxt: true
  robotsCacheTtl: "24h"
  backoff:
    initialBackoff: "30s"
    maxBackoff: "10m"
    multiplier: 2.0
    circuitOpenAfterFailures: 10

runtime:
  workers: 4
  maxDepth: 5
  maxRetries: 5
  crossRunDedup: true
  # Strategy for moving discovered outbound URLs into the Frontier.
  # "direct" (default): worker calls Frontier::submit_batch itself
  # after the metadata commit; loses URLs during transient Frontier
  # errors. "durable_outbox": outbound URLs commit atomically into a
  # Postgres outbox table; a publisher daemon drains them with
  # at-least-once delivery. Trade durability for ~50x lower Postgres
  # write rate vs `durable_outbox`.
  linkDispatch: "direct"

# Optional initial seed URLs loaded into the frontier at startup.
# When `content` is non-empty, the chart renders it into the same
# ConfigMap as crawl.toml (mounted at /etc/crawlrs/seeds.txt) and
# appends `--seeds /etc/crawlrs/seeds.txt` to the StatefulSet args.
# Production deployments typically leave this empty and load the
# frontier externally (kubectl exec, redis-cli, a one-shot Job).
# Local sandboxes set `content` to a multi-line string of URLs
# (one per line; blank lines and `#`-prefixed lines are skipped).
seeds:
  content: ""

store:
  parquet: true
  warc: true
  basePrefix: "crawlrs"
  backend:
    # kind: local | s3
    kind: local
    # Local FS path (used when kind=local). When kind=s3, the chart
    # ignores this.
    path: /var/lib/crawlrs/data
    # Pod-local storage shape (only relevant when kind=local).
    #   enabled=false (default) - emptyDir with sizeLimit. Fast,
    #     simple, blobs LOST on pod restart. Right for sandboxes
    #     validating the pipeline end-to-end.
    #   enabled=true - PVC via volumeClaimTemplates. Blobs survive
    #     pod restarts. Use when you want to keep what you crawl.
    persistence:
      enabled: false
      size: 10Gi
      # Only consulted when enabled=true; empty = cluster default.
      storageClassName: ""
      accessMode: ReadWriteOnce
    # S3 settings (used when kind=s3). access/secret pulled from the
    # Secret (S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY).
    s3:
      endpoint: ""
      bucket: ""
      region: "us-east-1"
      allowHttp: false
      virtualHostedStyleRequest: true

server:
  listen: "0.0.0.0:9090"
  port: 9090

sharding:
  numShards: 8

# ---- Secret credentials ---------------------------------------------
# Two modes:
#   create=true:        chart renders a Secret from `values.secrets.values`
#   existingSecret=...: chart references an externally-managed Secret
secrets:
  create: true
  existingSecret: ""
  # Plain values when create=true. Override these in production via
  # --set-file or a values file checked into a private store; the
  # defaults are sandbox-shape.
  values:
    redisUrl: "redis://redis-master:6379"
    postgresUrl: "postgres://crawlrs:crawlrs@postgres:5432/crawlrs"
    s3AccessKeyId: ""
    s3SecretAccessKey: ""

# ---- Pod / container shape ------------------------------------------
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 2Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

probes:
  startup:
    enabled: true
    path: /livez
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    enabled: true
    path: /livez
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Toggles whether the binary writes JSON-formatted logs (production)
# or text logs (dev). The chart sets CRAWLRS_LOG_FORMAT accordingly.
logFormat: json

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ---- Bundled observability (Phase 6c) -------------------------------
# The chart ships its own vmsingle + Grafana so the crawler stack is
# self-contained. Operators with their own Prometheus / VM / Grafana
# fleet should set `o11y.enabled: false` and point their own scraper
# at <release>-crawlrs-headless:9090/metrics.
o11y:
  enabled: true

  vmsingle:
    image:
      repository: victoriametrics/victoria-metrics
      tag: v1.107.0
      pullPolicy: IfNotPresent
    # Persistent volume for the time-series data dir.
    storage:
      size: 10Gi
      storageClassName: ""    # empty = cluster default StorageClass
      accessMode: ReadWriteOnce
    # vmsingle CLI flags. retentionPeriod accepts h / d / w / M / y
    # suffixes (e.g. "1M" for one month, "7d" for a week).
    retentionPeriod: 1M
    scrapeInterval: 15s
    # Extra args appended to the vmsingle container command. Use for
    # vmui customization, dedup, etc.
    extraArgs: []
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    service:
      port: 8429
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

  grafana:
    enabled: true
    image:
      repository: grafana/grafana
      tag: 11.4.0
      pullPolicy: IfNotPresent
    # Sandbox-shape default; override in production via --set or
    # secrets management. Set to "" to skip provisioning the env var
    # (Grafana then prompts for password on first login).
    adminUser: admin
    adminPassword: admin
    # Names match the ConfigMaps the chart provisions; only override
    # if you're swapping in your own.
    datasourceProvisioning: true
    dashboardProvisioning: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    service:
      port: 3000
      type: ClusterIP
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
