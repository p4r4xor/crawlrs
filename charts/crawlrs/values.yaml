# Default values for the crawlrs chart. Override via
# `helm install ... -f my-values.yaml` or `--set key=val`.
#
# Required overrides for any non-trivial deploy:
#   redis.url, postgres.url, store.backend.*

# ---- Image -----------------------------------------------------------
image:
  repository: ghcr.io/p4r4xor/crawlrs
  # If empty, the chart uses Chart.appVersion as the tag.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

# ---- Replicas + sharding --------------------------------------------
# The default sharding policy is HostHashShardPolicy(8): 8 shards
# bounds hot-domain head-of-line blocking to one shard's worker
# capacity while keeping per-shard memory small enough that one Redis
# instance can hold all per-shard state. replicaCount is independent:
# with N replicas + 8 shards, each pod owns shards
# (ordinal, ordinal + N, ...) per the binary's CRAWLRS_REPLICAS-aware
# logic in factory.rs.
replicaCount: 1

# ---- crawl.toml content ---------------------------------------------
# These values are rendered into the ConfigMap as crawl.toml. The
# binary reads /etc/crawlrs/crawl.toml at startup. Credentials live in
# the Secret and are env-var-overlaid (CRAWLRS_REDIS_URL,
# CRAWLRS_POSTGRES_URL).
runId: "demo"

redis:
  # Read from the Secret as CRAWLRS_REDIS_URL. Set this to point at
  # your Redis instance. `redis://...` URLs only; `redis-sentinel://`
  # is rejected at startup until v1.x.
  url: "redis://redis-master:6379"
  poolSize: 16

postgres:
  # Read from the Secret as CRAWLRS_POSTGRES_URL. `postgres://...`
  # connection string. Pool size sized to >= 2 * (workers per pod).
  url: "postgres://crawlrs:crawlrs@postgres:5432/crawlrs"
  poolSize: 8

fetch:
  maxBodyBytes: 10485760
  # Override the wire User-Agent. Empty (the default) lets wreq's
  # randomized emulation profile drive the UA so the wire string and
  # the TLS / HTTP/2 fingerprint match. Set this only when you want
  # to advertise a specific crawler identity (e.g. for a site-by-site
  # politeness allowlist that gates on UA).
  userAgent: ""
  defaultTimeout: "60s"
  # Stalls between body chunks fail after this. Independent of
  # defaultTimeout (which caps the whole request). Slowloris guard.
  readTimeout: "30s"

crawl:
  # Operator-mandated crawl scope: per-host depth and URL caps.
  # Distinct from `politeness` (which is behavior toward a host as
  # a guest); scope describes your own crawl's shape. Both globals
  # are `null` (= unbounded) by default; per-host overrides in
  # `perDomain.<host>.{maxDepth,maxUrls}` can raise or lower an
  # individual host's cap. Per-host Redis counter storage is only
  # allocated when at least one cap is configured.
  maxDepth: null
  maxUrls: null
  # Per-host scope overrides. Keys are exact host strings (no
  # eTLD+1 rollup; `docs.python.org` and `python.org` are distinct
  # quotas). Example:
  #
  # perDomain:
  #   "docs.rust-lang.org":
  #     maxDepth: 12
  #     maxUrls: 1000000
  #   "rust-lang.org":
  #     maxUrls: 5000
  perDomain: {}

access:
  # Hosts the crawler refuses to visit. Checked first, before
  # robots / rate / backoff. Exact host strings; subdomain matching
  # is not performed here.
  #
  # blocklist:
  #   - "example.com"
  #   - "do-not-crawl.org"
  blocklist: []

politeness:
  # Master switch. `false` wires the politeness layer to no-op
  # impls; the runtime sees an `Allow`-everything `Politeness` with
  # zero Redis I/O for rate/robots/backoff. Use only against
  # infrastructure you own or with explicit permission. The
  # `[crawl]` and `[access]` controls remain active when politeness
  # is disabled; they're separate concerns.
  enabled: true
  hostDelay: "1s"
  # Default off: pairs with the empty fetch.userAgent above so the
  # chart validates out of the box in stealth mode (random emulation,
  # no robots gate). Flip to true and pin fetch.userAgent to a stable
  # identity when you want polite-bot behaviour.
  obeyRobotsTxt: false
  robotsTtl: "24h"
  backoff:
    initialBackoff: "30s"
    maxBackoff: "10m"
    multiplier: 2.0
    failureThreshold: 10
  # Per-host politeness overrides. Each entry can set any subset of
  # hostDelay / obeyRobotsTxt / robotsTtl; unset fields inherit the
  # global defaults above. Per-host scope overrides (maxDepth /
  # maxUrls) live under `crawl.perDomain`, not here. Example:
  #
  # perDomain:
  #   "docs.rust-lang.org":
  #     hostDelay: "500ms"
  perDomain: {}

runtime:
  workers: 4
  maxRetries: 5
  # Strategy for moving discovered outbound URLs into the Frontier.
  # "direct" (default): worker calls Frontier::submit_batch itself
  # after the metadata commit; loses URLs during transient Frontier
  # errors. "durable_outbox": outbound URLs commit atomically into a
  # Postgres outbox table; a publisher daemon drains them with
  # at-least-once delivery. Trade durability for ~50x lower Postgres
  # write rate vs `durable_outbox`.
  linkDispatch: "direct"

# ---- Frontier ------------------------------------------------------
# Operator-tunable knobs for the Redis-backed Frontier. Defaults are
# sized for the standard per-shard layout; raise `bloomCapacity` for
# runs expected to submit more than ~1M unique URLs (oversizing
# wastes some Redis RAM at startup; undersizing causes RedisBloom to
# stack additional sub-filters, which costs per-op CPU and memory).
frontier:
  # Lease expiry on an in-flight URL. Workers that hold a URL past
  # this are presumed dead; the reclaim pass re-pushes the URL.
  leaseTimeout: "60s"
  # Cadence at which the runtime drives `Frontier::tick` (promoter +
  # lease-reclaim passes). 50ms keeps the latency tail collapsed
  # under sustained load.
  promoterTick: "50ms"
  # Initial capacity of the RedisBloom filter that fronts submit.
  # Size to expected unique URLs in the run with ~20% headroom.
  bloomCapacity: 10000000
  # Target false-positive rate at `bloomCapacity`. Each false
  # positive silently drops a URL at submit; 0.1% is a good default
  # for runs that re-crawl periodically. 0.001 ~ 1.8 bytes/URL of
  # Redis RAM.
  bloomFpr: 0.001

# Optional initial seed URLs loaded into the Frontier at chart-install
# time. When `content` is non-empty:
#
#   1. The chart renders it into the main ConfigMap as `seeds.txt`
#      (alongside `crawl.toml`), mounted at /etc/crawlrs/seeds.txt.
#   2. A one-shot `crawlrs seed` Job is created via the
#      `helm.sh/hook: post-install` annotation. It loads the URLs
#      into the Frontier and exits.
#
# The StatefulSet itself NEVER reads seeds; pod restarts do not
# re-trigger seed-loading. To force a reseed after the initial
# install, run `helm install --replace ...` or
# `kubectl create job --from=job/<release>-seed reseed-...`.
#
# Production deployments typically leave this empty and load the
# Frontier externally (their own bootstrap job, Postgres-backed
# populator, etc.). Local sandboxes set `content` to a multi-line
# string of URLs (one per line; blanks + `#`-prefixed lines skipped).
seeds:
  content: ""

store:
  parquet: true
  warc: true
  basePrefix: "crawlrs"
  # Rotation thresholds (per shard). The first trigger to fire closes
  # the current file. Peak writer memory is ~(num_shards * maxBytes)
  # since each shard buffers raw bytes + per-row state in RAM until
  # the file is uploaded; tune these together with resources.limits.
  rotation:
    maxBytes: 134217728   # 128 MiB
    maxRows: 100000
    maxDuration: "30m"
  backend:
    # kind: local | s3
    kind: local
    # Local FS path (used when kind=local). When kind=s3, the chart
    # ignores this.
    path: /var/lib/crawlrs/data
    # Pod-local storage shape (only relevant when kind=local).
    #   enabled=false (default) - emptyDir with sizeLimit. Fast,
    #     simple, blobs LOST on pod restart. Right for sandboxes
    #     validating the pipeline end-to-end.
    #   enabled=true - PVC via volumeClaimTemplates. Blobs survive
    #     pod restarts. Use when you want to keep what you crawl.
    persistence:
      enabled: false
      size: 10Gi
      # Only consulted when enabled=true; empty = cluster default.
      storageClassName: ""
      accessMode: ReadWriteOnce
    # S3 settings (used when kind=s3). access/secret pulled from the
    # Secret (S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY).
    s3:
      endpoint: ""
      bucket: ""
      region: "us-east-1"
      allowHttp: false
      virtualHostedStyleRequest: true

server:
  listen: "0.0.0.0:9090"
  port: 9090
  # Optional sibling NodePort Service that exposes /metrics on a fixed
  # node port. Intended for local-kind dev where `local/kind.yaml`'s
  # extraPortMappings publish hostPort 9090 -> nodePort 30090, so the
  # /metrics endpoint is reachable on the developer's host without
  # `kubectl port-forward`. Disabled by default to keep production
  # deploys ClusterIP-only.
  localNodePort:
    enabled: false
    nodePort: 30090

sharding:
  numShards: 8

# ---- Secret credentials ---------------------------------------------
# Two modes:
#   create=true:        chart renders a Secret from `values.secrets.values`
#   existingSecret=...: chart references an externally-managed Secret
secrets:
  create: true
  existingSecret: ""
  # Plain values when create=true. Override these in production via
  # --set-file or a values file checked into a private store; the
  # defaults are sandbox-shape.
  values:
    redisUrl: "redis://redis-master:6379"
    postgresUrl: "postgres://crawlrs:crawlrs@postgres:5432/crawlrs"
    s3AccessKeyId: ""
    s3SecretAccessKey: ""

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 2Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# Init containers gate the crawler container's startup on Redis and
# Postgres being reachable. Without them, the crawler crashloops a
# few times during fresh `helm install` while the StatefulSets are
# still bringing up their pods. `redis-cli ping` and `pg_isready`
# only succeed once the server is actually serving protocol traffic,
# which is what the crawler needs (a TCP-open Postgres mid-initdb
# would still fail sqlx's first connect).
#
# Disable when running against managed databases that are reachable
# before the chart installs.
initContainers:
  enabled: true
  # Hard ceiling per init container. If the dep still isn't up after
  # this many seconds, the init exits non-zero so k8s surfaces the
  # real failure instead of looping silently forever.
  deadlineSeconds: 180
  redis:
    image: redis:7-alpine
  postgres:
    image: postgres:17-alpine

probes:
  startup:
    enabled: true
    path: /livez
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
  liveness:
    enabled: true
    path: /livez
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Toggles whether the binary writes JSON-formatted logs (production)
# or text logs (dev). The chart sets CRAWLRS_LOG_FORMAT accordingly.
logFormat: json

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}

serviceAccount:
  create: true
  name: ""
  annotations: {}

# The chart ships its own vmsingle + Grafana so the crawler stack is
# self-contained. Operators with their own Prometheus / VM / Grafana
# fleet should set `o11y.enabled: false` and point their own scraper
# at <release>-crawlrs-headless:9090/metrics.
o11y:
  enabled: true

  vmsingle:
    image:
      repository: victoriametrics/victoria-metrics
      tag: v1.107.0
      pullPolicy: IfNotPresent
    # Persistent volume for the time-series data dir.
    storage:
      size: 10Gi
      storageClassName: "" # empty = cluster default StorageClass
      accessMode: ReadWriteOnce
    # vmsingle CLI flags. retentionPeriod accepts h / d / w / M / y
    # suffixes (e.g. "1M" for one month, "7d" for a week).
    retentionPeriod: 1M
    scrapeInterval: 15s
    # Extra args appended to the vmsingle container command. Use for
    # vmui customization, dedup, etc.
    extraArgs: []
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    service:
      port: 8429
    # cAdvisor scraping: per-container CPU / memory / network / fs
    # metrics from kubelet, proxied through the apiserver. Adds a
    # ServiceAccount + ClusterRole + ClusterRoleBinding granting
    # `nodes`, `nodes/proxy`, `nodes/metrics` access.
    cadvisor:
      enabled: true
      # If non-empty, only keep cAdvisor samples whose `namespace`
      # label matches this regex. Default is just the crawlrs
      # namespace so vmsingle storage isn't polluted by kube-system /
      # other-tenant pods. Set to "" to keep all namespaces.
      namespaceFilter: "crawlrs"
    # redis_exporter scrape job. Only enable when a redis_exporter
    # sidecar (or standalone) is actually running and exposing
    # /metrics; otherwise the scrape just fails noisily. The umbrella
    # demo chart enables this by default (its Redis pod ships the
    # sidecar); standalone deploys leave it off.
    redisExporter:
      enabled: false
      # DNS name + port of the redis_exporter metrics endpoint. For
      # the demo umbrella this is the Redis service's metrics port:
      # `<release>-redis:9121`.
      target: ""
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000

  grafana:
    enabled: true
    image:
      repository: grafana/grafana
      tag: 11.4.0
      pullPolicy: IfNotPresent
    # Sandbox-shape default; override in production via --set or
    # secrets management. Set to "" to skip provisioning the env var
    # (Grafana then prompts for password on first login).
    adminUser: admin
    adminPassword: admin
    # Names match the ConfigMaps the chart provisions; only override
    # if you're swapping in your own.
    datasourceProvisioning: true
    dashboardProvisioning: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    service:
      port: 3000
      type: ClusterIP
      # Honoured only when `type: NodePort`. Local kind dev sets this
      # to 30300 to align with `local/kind.yaml`'s extraPortMappings,
      # which forward hostPort 3000 -> nodePort 30300. Empty in
      # ClusterIP mode (the default).
      nodePort: ""
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
