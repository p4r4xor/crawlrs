apiVersion: v2
name: crawlrs
description: |
  Distributed web crawler. Deploys the crawler as a StatefulSet (stable
  per-pod ordinals; per-pod DNS via headless Service). Phase 6b ships
  the crawler-only chart; Phase 6c adds bundled vmsingle + Grafana for
  the self-contained observability stack.
type: application

# `version` is the chart version, bumped on template / values changes.
# `appVersion` is the crawlrs binary version, follows the crate version.
# Tag in the registry should match appVersion.
#
# 0.1.0: Phase 6c adds bundled vmsingle + Grafana + dashboards.
# 0.0.1: Phase 6b - crawler-only chart.
version: 0.1.0
appVersion: "0.0.1"

home: https://github.com/p4r4xor/crawlrs
sources:
  - https://github.com/p4r4xor/crawlrs

keywords:
  - crawler
  - web-crawler
  - distributed
  - rust

maintainers:
  - name: p4r4xor
    url: https://github.com/p4r4xor
