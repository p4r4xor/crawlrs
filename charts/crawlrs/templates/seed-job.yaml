{{- if .Values.seeds.content }}
# post-install only, so `helm upgrade` and pod restarts never re-seed.
# See the chart README for how to force a reseed.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "crawlrs.fullname" . }}-seed
  labels:
    {{- include "crawlrs.labels" . | nindent 4 }}
    app.kubernetes.io/component: seed-bootstrap
  annotations:
    # Weight -5 runs before NOTES.txt; before-hook-creation clears a
    # prior Job on `helm install --replace`.
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  # Bounded so a malformed seeds file fails visibly instead of looping.
  backoffLimit: 3
  # Successful Jobs are reaped after 1h; failed ones stay for their logs.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "crawlrs.labels" . | nindent 8 }}
        app.kubernetes.io/component: seed-bootstrap
    spec:
      serviceAccountName: {{ include "crawlrs.serviceAccountName" . }}
      restartPolicy: OnFailure
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.initContainers.enabled }}
      # The seed path never opens a Postgres connection.
      initContainers:
        - name: wait-for-valkey
          image: {{ .Values.initContainers.redis.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CRAWLRS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "crawlrs.secretName" . }}
                  key: redisUrl
          command: ["sh", "-c"]
          args:
            - |
              deadline=$(( $(date +%s) + {{ .Values.initContainers.deadlineSeconds }} ))
              until valkey-cli -u "$CRAWLRS_REDIS_URL" ping 2>/dev/null | grep -q PONG; do
                if [ $(date +%s) -ge $deadline ]; then
                  echo "redis still not ready after {{ .Values.initContainers.deadlineSeconds }}s; giving up"
                  exit 1
                fi
                echo "waiting for redis..."
                sleep 2
              done
              echo "redis ready"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      {{- end }}
      containers:
        - name: seed
          image: {{ include "crawlrs.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - seed
            - --config
            - /etc/crawlrs/crawl.toml
            - --path
            - /etc/crawlrs/seeds.txt
          env:
            - name: CRAWLRS_LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
            - name: CRAWLRS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "crawlrs.secretName" . }}
                  key: redisUrl
            # Required by the config loader even though it goes unused here.
            - name: CRAWLRS_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "crawlrs.secretName" . }}
                  key: postgresUrl
          volumeMounts:
            - name: config
              mountPath: /etc/crawlrs
              readOnly: true
            - name: scratch
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "crawlrs.configMapName" . }}
        - name: scratch
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
