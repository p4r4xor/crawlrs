apiVersion: v1
kind: Service
metadata:
  name: {{ include "crawlrs.headlessServiceName" . }}
  labels:
    {{- include "crawlrs.labels" . | nindent 4 }}
  annotations:
    # Mark as a headless service for stable per-pod DNS. Pods get
    # `<statefulset>-<ordinal>.<headless-service>` resolution. vmsingle
    # (Phase 6c) scrapes per-pod via this DNS.
    service.kubernetes.io/headless: "true"
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: false
  selector:
    {{- include "crawlrs.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.server.port }}
      targetPort: http
      protocol: TCP
{{- if .Values.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "crawlrs.serviceAccountName" . }}
  labels:
    {{- include "crawlrs.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
