apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "crawlrs.fullname" . }}
  labels:
    {{- include "crawlrs.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "crawlrs.headlessServiceName" . }}
  replicas: {{ .Values.replicaCount | int64 }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "crawlrs.componentSelectorLabels" (dict "component" "crawler" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "crawlrs.componentSelectorLabels" (dict "component" "crawler" "context" .) | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Cache-bust the pod when crawl.toml changes; rolls the
        # StatefulSet on `helm upgrade` if the rendered config diff
        # produces a new sha256.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "crawlrs.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Drain delay: SIGTERM -> /readyz unhealthy -> 5s drain ->
      # frontier shutdown -> worker drain -> store flush -> exit.
      # terminationGracePeriodSeconds caps total drain time.
      terminationGracePeriodSeconds: 60
      {{- if .Values.initContainers.enabled }}
      # Gate the crawler container on Redis + Postgres being reachable.
      # Each probe loops with a bounded deadline so a genuinely broken
      # config still fails visibly instead of spinning forever.
      initContainers:
        - name: wait-for-redis
          image: {{ .Values.initContainers.redis.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CRAWLRS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "crawlrs.secretName" . }}
                  key: redisUrl
          command: ["sh", "-c"]
          args:
            - |
              deadline=$(( $(date +%s) + {{ .Values.initContainers.deadlineSeconds }} ))
              until redis-cli -u "$CRAWLRS_REDIS_URL" ping 2>/dev/null | grep -q PONG; do
                if [ $(date +%s) -ge $deadline ]; then
                  echo "redis still not ready after {{ .Values.initContainers.deadlineSeconds }}s; giving up"
                  exit 1
                fi
                echo "waiting for redis..."
                sleep 2
              done
              echo "redis ready"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-postgres
          image: {{ .Values.initContainers.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CRAWLRS_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "crawlrs.secretName" . }}
                  key: postgresUrl
          command: ["sh", "-c"]
          args:
            - |
              deadline=$(( $(date +%s) + {{ .Values.initContainers.deadlineSeconds }} ))
              until pg_isready -d "$CRAWLRS_POSTGRES_URL" 2>/dev/null; do
                if [ $(date +%s) -ge $deadline ]; then
                  echo "postgres still not ready after {{ .Values.initContainers.deadlineSeconds }}s; giving up"
                  exit 1
                fi
                echo "waiting for postgres..."
                sleep 2
              done
              echo "postgres ready"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      {{- end }}
      containers:
        - name: crawlrs
          image: {{ include "crawlrs.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - crawl
            - --config
            - /etc/crawlrs/crawl.toml
            {{- if .Values.seeds.content }}
            - --seeds
            - /etc/crawlrs/seeds.txt
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.server.port | int64 }}
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CRAWLRS_REPLICAS
              value: {{ .Values.replicaCount | quote }}
            - name: CRAWLRS_LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
            - name: CRAWLRS_LISTEN
              value: {{ .Values.server.listen | quote }}
            {{- if .Values.o11y.jemallocProf.enabled }}
            # jemalloc heap profiler. `prof:true` registers the
            # profiler; `prof_active:true` starts collecting on boot.
            # `lg_prof_sample:19` samples every 2^19 (~512KB) of
            # allocated bytes (low overhead, good coverage).
            # `lg_prof_interval:30` dumps a heap profile every 2^30
            # (~1 GiB) of sampled allocation - tunable. Dumps land
            # under `prof_prefix` and are readable with `jeprof`.
            - name: MALLOC_CONF
              value: {{ .Values.o11y.jemallocProf.mallocConf | quote }}
            {{- end }}
            # Credentials sourced from the Secret. envFrom would pull
            # *every* key in the Secret; explicit envs document the
            # surface area.
            - name: CRAWLRS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "crawlrs.secretName" . }}
                  key: redisUrl
            - name: CRAWLRS_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "crawlrs.secretName" . }}
                  key: postgresUrl
            {{- if eq .Values.store.backend.kind "s3" }}
            - name: CRAWLRS_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "crawlrs.secretName" . }}
                  key: s3AccessKeyId
                  optional: true
            - name: CRAWLRS_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "crawlrs.secretName" . }}
                  key: s3SecretAccessKey
                  optional: true
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/crawlrs
              readOnly: true
            {{- if eq .Values.store.backend.kind "local" }}
            - name: store-data
              mountPath: {{ .Values.store.backend.path }}
            {{- end }}
            # Writable scratch dir for tokio + temp files. Required
            # because containerSecurityContext sets readOnlyRootFilesystem.
            - name: scratch
              mountPath: /tmp
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            {{- include "crawlrs.probe" (dict "probe" .Values.probes.startup "port" .Values.server.port) | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            {{- include "crawlrs.probe" (dict "probe" .Values.probes.liveness "port" .Values.server.port) | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            {{- include "crawlrs.probe" (dict "probe" .Values.probes.readiness "port" .Values.server.port) | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "crawlrs.configMapName" . }}
        - name: scratch
          emptyDir:
            sizeLimit: 256Mi
        {{- if and (eq .Values.store.backend.kind "local") (not .Values.store.backend.persistence.enabled) }}
        # kind=local + persistence.enabled=false: ephemeral pod-local
        # FS via emptyDir. Blobs LOST on pod restart. The PVC path
        # below kicks in when persistence.enabled=true.
        - name: store-data
          emptyDir:
            sizeLimit: {{ .Values.store.backend.persistence.size }}
        {{- end }}
  {{- if and (eq .Values.store.backend.kind "local") .Values.store.backend.persistence.enabled }}
  # kind=local + persistence.enabled=true: PVC per pod, survives
  # restarts. StatefulSet volumeClaimTemplates auto-provision a PV
  # bound to each pod's `store-data` mount point.
  volumeClaimTemplates:
    - metadata:
        name: store-data
        labels:
          {{- include "crawlrs.labels" . | nindent 10 }}
      spec:
        accessModes: [{{ .Values.store.backend.persistence.accessMode }}]
        {{- if .Values.store.backend.persistence.storageClassName }}
        storageClassName: {{ .Values.store.backend.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.store.backend.persistence.size | quote }}
  {{- end }}
