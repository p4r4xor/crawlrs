apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "crawlrs.fullname" . }}
  labels:
    {{- include "crawlrs.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "crawlrs.headlessServiceName" . }}
  replicas: {{ .Values.replicaCount | int64 }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "crawlrs.componentSelectorLabels" (dict "component" "crawler" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "crawlrs.componentSelectorLabels" (dict "component" "crawler" "context" .) | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Rolls the StatefulSet when the rendered crawl.toml changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "crawlrs.serviceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Caps total drain time; the shutdown sequence itself is in the README.
      terminationGracePeriodSeconds: 60
      {{- if .Values.initContainers.enabled }}
      initContainers:
        - name: wait-for-valkey
          image: {{ .Values.initContainers.redis.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CRAWLRS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "crawlrs.secretName" . }}
                  key: redisUrl
          command: ["sh", "-c"]
          args:
            - |
              deadline=$(( $(date +%s) + {{ .Values.initContainers.deadlineSeconds }} ))
              until valkey-cli -u "$CRAWLRS_REDIS_URL" ping 2>/dev/null | grep -q PONG; do
                if [ $(date +%s) -ge $deadline ]; then
                  echo "redis still not ready after {{ .Values.initContainers.deadlineSeconds }}s; giving up"
                  exit 1
                fi
                echo "waiting for redis..."
                sleep 2
              done
              echo "redis ready"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: wait-for-postgres
          image: {{ .Values.initContainers.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CRAWLRS_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "crawlrs.secretName" . }}
                  key: postgresUrl
          command: ["sh", "-c"]
          args:
            - |
              deadline=$(( $(date +%s) + {{ .Values.initContainers.deadlineSeconds }} ))
              until pg_isready -d "$CRAWLRS_POSTGRES_URL" 2>/dev/null; do
                if [ $(date +%s) -ge $deadline ]; then
                  echo "postgres still not ready after {{ .Values.initContainers.deadlineSeconds }}s; giving up"
                  exit 1
                fi
                echo "waiting for postgres..."
                sleep 2
              done
              echo "postgres ready"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      {{- end }}
      containers:
        - name: crawlrs
          image: {{ include "crawlrs.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - crawl
            - --config
            - /etc/crawlrs/crawl.toml
          ports:
            - name: http
              containerPort: {{ .Values.server.port | int64 }}
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: CRAWLRS_REPLICAS
              value: {{ .Values.replicaCount | quote }}
            - name: CRAWLRS_LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
            - name: CRAWLRS_LISTEN
              value: {{ .Values.server.listen | quote }}
            # Explicit rather than envFrom, which would pull every key.
            - name: CRAWLRS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "crawlrs.secretName" . }}
                  key: redisUrl
            - name: CRAWLRS_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "crawlrs.secretName" . }}
                  key: postgresUrl
            {{- if eq .Values.store.backend.kind "s3" }}
            - name: CRAWLRS_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "crawlrs.secretName" . }}
                  key: s3AccessKeyId
                  optional: true
            - name: CRAWLRS_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "crawlrs.secretName" . }}
                  key: s3SecretAccessKey
                  optional: true
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/crawlrs
              readOnly: true
            {{- if eq .Values.store.backend.kind "local" }}
            - name: store-data
              mountPath: {{ .Values.store.backend.path }}
            {{- end }}
            # Required: containerSecurityContext sets readOnlyRootFilesystem.
            - name: scratch
              mountPath: /tmp
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            {{- include "crawlrs.probe" (dict "probe" .Values.probes.startup "port" .Values.server.port) | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            {{- include "crawlrs.probe" (dict "probe" .Values.probes.liveness "port" .Values.server.port) | nindent 12 }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            {{- include "crawlrs.probe" (dict "probe" .Values.probes.readiness "port" .Values.server.port) | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "crawlrs.configMapName" . }}
        - name: scratch
          emptyDir:
            sizeLimit: 256Mi
        {{- if and (eq .Values.store.backend.kind "local") (not .Values.store.backend.persistence.enabled) }}
        # Blobs are lost on pod restart; set persistence.enabled=true for a PVC.
        - name: store-data
          emptyDir:
            sizeLimit: {{ .Values.store.backend.persistence.size }}
        {{- end }}
  {{- if and (eq .Values.store.backend.kind "local") .Values.store.backend.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: store-data
        labels:
          {{- include "crawlrs.labels" . | nindent 10 }}
      spec:
        accessModes: [{{ .Values.store.backend.persistence.accessMode }}]
        {{- if .Values.store.backend.persistence.storageClassName }}
        storageClassName: {{ .Values.store.backend.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.store.backend.persistence.size | quote }}
  {{- end }}
