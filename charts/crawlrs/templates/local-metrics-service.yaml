{{- if .Values.server.localNodePort.enabled }}
# The primary Service is headless for per-pod DNS, so it cannot carry a
# NodePort. This companion exists so kind's extraPortMappings can reach
# the crawler from the host; production deploys leave it disabled.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crawlrs.fullname" . }}-metrics-local
  labels:
    {{- include "crawlrs.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "crawlrs.componentSelectorLabels" (dict "component" "crawler" "context" .) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.server.port | int64 }}
      targetPort: http
      nodePort: {{ .Values.server.localNodePort.nodePort }}
      protocol: TCP
{{- end }}
