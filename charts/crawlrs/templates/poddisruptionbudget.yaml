{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "crawlrs.fullname" . }}
  labels:
    {{- include "crawlrs.labels" . | nindent 4 }}
spec:
  # IntOrString: accepts both `1` (int) and `"25%"` (string). Skip
  # the `| int64` cast we use elsewhere — it would break the
  # percentage form. Values are always small (single digits) so the
  # float-coercion bug doesn't bite here.
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "crawlrs.selectorLabels" . | nindent 6 }}
{{- end }}
