apiVersion: v1
kind: Pod
metadata:
  name: {{ include "crawlrs.fullname" . }}-test-readyz
  labels:
    {{- include "crawlrs.labels" . | nindent 4 }}
  annotations:
    # `helm test` reaps pods with policy=helm.sh/hook (test).
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  # Hits the first pod's /readyz via the headless Service. If the
  # crawler hasn't reported ready, this pod fails the readiness check
  # and `helm test` returns non-zero.
  containers:
    - name: readyz-probe
      image: busybox:1.37.0
      command:
        - sh
        - -c
        - |
          set -eu
          target="{{ include "crawlrs.fullname" . }}-0.{{ include "crawlrs.headlessServiceName" . }}.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.server.port }}/readyz"
          echo "probing http://${target}"
          # Try every 2s for up to 60s; pods take a moment to come up.
          for i in $(seq 1 30); do
            if wget -q -O- "http://${target}" | grep -q ready; then
              echo "OK"
              exit 0
            fi
            sleep 2
          done
          echo "FAIL: /readyz did not return 'ready' within 60s"
          exit 1
