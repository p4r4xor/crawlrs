{{- if and .Values.o11y.enabled .Values.o11y.vmsingle.cadvisor.enabled }}
# vmsingle reaches kubelet cAdvisor through the apiserver proxy, which
# needs LIST/WATCH on nodes plus the nodes/proxy subresource. Both are
# cluster-scoped because node objects are. Read-only by design: no pods,
# services, endpoints, secrets, or any mutating verb.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "crawlrs.vmsingleName" . }}
  labels:
    {{- include "crawlrs.componentLabels" (dict "component" "vmsingle" "context" .) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "crawlrs.vmsingleName" . }}-cadvisor-scrape
  labels:
    {{- include "crawlrs.componentLabels" (dict "component" "vmsingle" "context" .) | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "crawlrs.vmsingleName" . }}-cadvisor-scrape
  labels:
    {{- include "crawlrs.componentLabels" (dict "component" "vmsingle" "context" .) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "crawlrs.vmsingleName" . }}-cadvisor-scrape
subjects:
  - kind: ServiceAccount
    name: {{ include "crawlrs.vmsingleName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
