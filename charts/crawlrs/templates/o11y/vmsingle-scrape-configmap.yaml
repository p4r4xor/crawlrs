{{- if .Values.o11y.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crawlrs.vmsingleScrapeConfigMapName" . }}
  labels:
    {{- include "crawlrs.componentLabels" (dict "component" "vmsingle" "context" .) | nindent 4 }}
data:
  scrape.yml: |
    # vmsingle scrape config (Prometheus-compatible).
    global:
      scrape_interval: {{ .Values.o11y.vmsingle.scrapeInterval }}
      external_labels:
        cluster: crawlrs
        run_id: {{ .Values.runId | quote }}

    scrape_configs:
      # Crawler application metrics: per-pod /metrics on the headless
      # Service. Static targets so vmsingle doesn't need K8s SD for
      # the common case.
      - job_name: crawlrs
        metrics_path: /metrics
        static_configs:
          - targets:
            {{- $fullname := include "crawlrs.fullname" . }}
            {{- $headless := include "crawlrs.headlessServiceName" . }}
            {{- $namespace := .Release.Namespace }}
            {{- $port := .Values.server.port | int64 }}
            {{- range $i, $_ := until (.Values.replicaCount | int) }}
              - "{{ $fullname }}-{{ $i }}.{{ $headless }}.{{ $namespace }}.svc.cluster.local:{{ $port }}"
            {{- end }}
            labels:
              service: crawlrs
      {{- if .Values.o11y.vmsingle.redisExporter.enabled }}

      # Valkey health metrics from the redis_exporter sidecar, exposed on
      # port 9121 alongside 6379. Target name is the umbrella chart's
      # service: `<release>-redis:9121`.
      - job_name: redis
        metrics_path: /metrics
        static_configs:
          - targets:
              - "{{ tpl .Values.o11y.vmsingle.redisExporter.target . }}"
            labels:
              service: redis
      {{- end }}
      {{- if .Values.o11y.vmsingle.cadvisor.enabled }}

      # Kubelet's cAdvisor endpoint: per-container CPU, memory,
      # network, fs metrics. We proxy through the apiserver
      # (`/api/v1/nodes/<name>/proxy/metrics/cadvisor`) so vmsingle
      # only needs cluster-internal credentials, not direct kubelet
      # access. ServiceAccount token + cluster CA from the standard
      # in-cluster mount paths.
      #
      # Filtered to the crawlrs namespace via metric_relabel so the
      # vmsingle storage doesn't fill with cluster-wide noise; flip
      # `o11y.vmsingle.cadvisor.namespaceFilter` to "" to scrape all.
      - job_name: kubelet-cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: false
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
        {{- with .Values.o11y.vmsingle.cadvisor.namespaceFilter }}
        metric_relabel_configs:
          - source_labels: [namespace]
            regex: {{ . | quote }}
            action: keep
        {{- end }}
      {{- end }}
{{- end }}
