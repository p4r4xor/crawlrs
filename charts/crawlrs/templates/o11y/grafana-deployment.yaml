{{- if and .Values.o11y.enabled .Values.o11y.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crawlrs.grafanaName" . }}
  labels:
    {{- include "crawlrs.componentLabels" (dict "component" "grafana" "context" .) | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "crawlrs.componentSelectorLabels" (dict "component" "grafana" "context" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "crawlrs.componentSelectorLabels" (dict "component" "grafana" "context" .) | nindent 8 }}
      annotations:
        # Restart Grafana when datasource / dashboard / dashboards-
        # provider ConfigMaps change.
        checksum/datasource: {{ include (print $.Template.BasePath "/o11y/grafana-datasource-configmap.yaml") . | sha256sum }}
        checksum/dashboards-provider: {{ include (print $.Template.BasePath "/o11y/grafana-dashboards-provider-configmap.yaml") . | sha256sum }}
        checksum/dashboards: {{ include (print $.Template.BasePath "/o11y/grafana-dashboards-configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        {{- toYaml .Values.o11y.grafana.podSecurityContext | nindent 8 }}
      containers:
        - name: grafana
          image: "{{ .Values.o11y.grafana.image.repository }}:{{ .Values.o11y.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.o11y.grafana.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            {{- if .Values.o11y.grafana.adminUser }}
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.o11y.grafana.adminUser | quote }}
            {{- end }}
            {{- if .Values.o11y.grafana.adminPassword }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: {{ .Values.o11y.grafana.adminPassword | quote }}
            {{- end }}
            # Headless install: anonymous read enabled so operators
            # can hit the dashboards without login during initial
            # deploy. Disable in production by overriding.
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            # Tell Grafana not to phone home.
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            {{- if .Values.o11y.grafana.featureToggles }}
            - name: GF_FEATURE_TOGGLES_ENABLE
              value: {{ .Values.o11y.grafana.featureToggles | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            {{- if .Values.o11y.grafana.datasourceProvisioning }}
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            {{- end }}
            {{- if .Values.o11y.grafana.dashboardProvisioning }}
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            {{- end }}
            # Grafana writes its sqlite to /var/lib/grafana; emptyDir
            # since we don't need to persist user state across pod
            # restarts (sandbox shape).
            - name: grafana-data
              mountPath: /var/lib/grafana
          resources:
            {{- toYaml .Values.o11y.grafana.resources | nindent 12 }}
      volumes:
        {{- if .Values.o11y.grafana.datasourceProvisioning }}
        - name: datasources
          configMap:
            name: {{ include "crawlrs.grafanaDatasourceConfigMapName" . }}
        {{- end }}
        {{- if .Values.o11y.grafana.dashboardProvisioning }}
        - name: dashboards-provider
          configMap:
            name: {{ include "crawlrs.grafanaDashboardsProviderConfigMapName" . }}
        - name: dashboards
          configMap:
            name: {{ include "crawlrs.grafanaDashboardsConfigMapName" . }}
        {{- end }}
        - name: grafana-data
          emptyDir:
            sizeLimit: 1Gi
{{- end }}
