{{- if and .Values.o11y.enabled .Values.o11y.grafana.enabled .Values.o11y.grafana.dashboardProvisioning }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crawlrs.grafanaDashboardsConfigMapName" . }}
  labels:
    {{- include "crawlrs.componentLabels" (dict "component" "grafana" "context" .) | nindent 4 }}
data:
  # Each dashboard JSON file in charts/crawlrs/dashboards/ becomes a
  # key here. Grafana's file-provider scans /var/lib/grafana/dashboards
  # (where this ConfigMap mounts) for *.json. Adding a new dashboard
  # is just dropping a JSON file next to the others; no template
  # changes needed.
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
