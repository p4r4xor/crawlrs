apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crawlrs.configMapName" . }}
  labels:
    {{- include "crawlrs.labels" . | nindent 4 }}
data:
  # Credentials here are placeholders; the env-var overlay from the
  # Secret wins at runtime.
  #
  # Casts are load-bearing: `| quote` because unquoted TOML strings are
  # rejected, `| int64` because Helm parses numbers as float64 and any
  # int >= 10^6 renders as scientific notation (5242880 -> 5.24288e+06).
  # Bools take no cast; Sprig has no `toBool`, and a hand-rolled one
  # reads `"no"` as true.
  crawl.toml: |
    run_id = {{ .Values.runId | quote }}

    [redis]
    url = {{ .Values.redis.url | quote }}
    pool_size = {{ .Values.redis.poolSize | int64 }}

    [postgres]
    url = {{ .Values.postgres.url | quote }}
    pool_size = {{ .Values.postgres.poolSize | int64 }}

    [fetch]
    max_body_bytes  = {{ .Values.fetch.maxBodyBytes | int64 }}
    {{- with .Values.fetch.userAgent }}
    user_agent      = {{ . | quote }}
    {{- end }}
    default_timeout = {{ .Values.fetch.defaultTimeout | quote }}
    read_timeout    = {{ .Values.fetch.readTimeout | quote }}

    [crawl]
    {{- if .Values.crawl.maxDepth }}
    max_depth = {{ .Values.crawl.maxDepth | int64 }}
    {{- end }}
    {{- if .Values.crawl.maxUrls }}
    max_urls  = {{ .Values.crawl.maxUrls | int64 }}
    {{- end }}
    {{- range $host, $override := .Values.crawl.perDomain }}

    [crawl.per_domain."{{ $host }}"]
    {{- with $override.maxDepth }}
    max_depth = {{ . | int64 }}
    {{- end }}
    {{- with $override.maxUrls }}
    max_urls  = {{ . | int64 }}
    {{- end }}
    {{- end }}

    [access]
    blocklist = [
    {{- range $i, $host := .Values.access.blocklist }}
    {{- if $i }},{{ end }} {{ $host | quote }}
    {{- end }} ]

    [politeness]
    enabled          = {{ .Values.politeness.enabled }}
    host_delay       = {{ .Values.politeness.hostDelay | quote }}
    obey_robots_txt  = {{ .Values.politeness.obeyRobotsTxt }}
    robots_ttl       = {{ .Values.politeness.robotsTtl | quote }}

    [politeness.backoff]
    initial_backoff             = {{ .Values.politeness.backoff.initialBackoff | quote }}
    max_backoff                 = {{ .Values.politeness.backoff.maxBackoff | quote }}
    multiplier                  = {{ .Values.politeness.backoff.multiplier | float64 }}
    failure_threshold           = {{ .Values.politeness.backoff.failureThreshold | int64 }}
    {{- range $host, $override := .Values.politeness.perDomain }}

    [politeness.per_domain."{{ $host }}"]
    {{- with $override.hostDelay }}
    host_delay      = {{ . | quote }}
    {{- end }}
    {{- with $override.obeyRobotsTxt }}
    obey_robots_txt = {{ . }}
    {{- end }}
    {{- with $override.robotsTtl }}
    robots_ttl      = {{ . | quote }}
    {{- end }}
    {{- end }}

    [runtime]
    workers          = {{ .Values.runtime.workers | int64 }}
    max_retries      = {{ .Values.runtime.maxRetries | int64 }}
    link_dispatch    = {{ .Values.runtime.linkDispatch | quote }}

    [frontier]
    lease_timeout             = {{ .Values.frontier.leaseTimeout | quote }}
    promoter_tick             = {{ .Values.frontier.promoterTick | quote }}
    bloom_capacity            = {{ .Values.frontier.bloomCapacity | int64 }}
    bloom_fpr                 = {{ .Values.frontier.bloomFpr | float64 }}

    [store]
    parquet     = {{ .Values.store.parquet }}
    warc        = {{ .Values.store.warc }}
    base_prefix = {{ .Values.store.basePrefix | quote }}

    [store.rotation]
    max_bytes    = {{ .Values.store.rotation.maxBytes | int64 }}
    max_rows     = {{ .Values.store.rotation.maxRows | int64 }}
    max_duration = {{ .Values.store.rotation.maxDuration | quote }}

    [store.backend]
    kind = {{ .Values.store.backend.kind | quote }}
    {{- if eq .Values.store.backend.kind "local" }}
    path = {{ .Values.store.backend.path | quote }}
    {{- else if eq .Values.store.backend.kind "s3" }}
    {{- with .Values.store.backend.s3 }}
    bucket                       = {{ .bucket | quote }}
    region                       = {{ .region | quote }}
    {{- if .endpoint }}
    endpoint                     = {{ .endpoint | quote }}
    {{- end }}
    allow_http                   = {{ .allowHttp }}
    virtual_hosted_style_request = {{ .virtualHostedStyleRequest }}
    # access_key_id / secret_access_key arrive via env (the Secret).
    {{- end }}
    {{- end }}

    [server]
    listen = {{ .Values.server.listen | quote }}

    [sharding]
    num_shards = {{ .Values.sharding.numShards | int64 }}
  {{- if .Values.seeds.content }}
  # Optional seed list. Mounted at /etc/crawlrs/seeds.txt. Consumed
  # by the post-install `<release>-crawlrs-seed` Job which runs
  # `crawlrs seed --path /etc/crawlrs/seeds.txt` once and exits.
  # The StatefulSet never reads this key.
  seeds.txt: |
    {{- .Values.seeds.content | nindent 4 }}
  {{- end }}
