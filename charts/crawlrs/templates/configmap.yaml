apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crawlrs.configMapName" . }}
  labels:
    {{- include "crawlrs.labels" . | nindent 4 }}
data:
  # Rendered crawl.toml. Credentials (redis url, postgres url) are
  # placeholders here and overwritten via env-var overlay
  # (CRAWLRS_REDIS_URL, CRAWLRS_POSTGRES_URL) sourced from the Secret.
  # The binary's apply_env_overlay() makes the env values win.
  #
  # Numeric values are rendered through `int64`/`%d` to avoid Helm's
  # default `fmt.Sprint(float64(...))` which prints large ints in
  # scientific notation (e.g. 5242880 -> 5.24288e+06) and breaks TOML.
  crawl.toml: |
    run_id = {{ .Values.runId | quote }}

    [redis]
    url = {{ .Values.redis.url | quote }}
    pool_size = {{ printf "%d" (.Values.redis.poolSize | int64) }}

    [postgres]
    url = {{ .Values.postgres.url | quote }}
    pool_size = {{ printf "%d" (.Values.postgres.poolSize | int64) }}

    [fetch]
    max_body_bytes  = {{ printf "%d" (.Values.fetch.maxBodyBytes | int64) }}
    user_agent      = {{ .Values.fetch.userAgent | quote }}
    default_timeout = {{ .Values.fetch.defaultTimeout | quote }}

    [politeness]
    min_delay        = {{ .Values.politeness.minDelay | quote }}
    honor_robots_txt = {{ .Values.politeness.honorRobotsTxt }}
    robots_cache_ttl = {{ .Values.politeness.robotsCacheTtl | quote }}

    [politeness.backoff]
    initial_backoff             = {{ .Values.politeness.backoff.initialBackoff | quote }}
    max_backoff                 = {{ .Values.politeness.backoff.maxBackoff | quote }}
    multiplier                  = {{ .Values.politeness.backoff.multiplier }}
    circuit_open_after_failures = {{ printf "%d" (.Values.politeness.backoff.circuitOpenAfterFailures | int64) }}

    [runtime]
    workers          = {{ printf "%d" (.Values.runtime.workers | int64) }}
    {{- if .Values.runtime.maxDepth }}
    max_depth        = {{ printf "%d" (.Values.runtime.maxDepth | int64) }}
    {{- end }}
    max_retries      = {{ printf "%d" (.Values.runtime.maxRetries | int64) }}
    cross_run_dedup  = {{ .Values.runtime.crossRunDedup }}
    link_dispatch    = {{ .Values.runtime.linkDispatch | quote }}

    [store]
    parquet     = {{ .Values.store.parquet }}
    warc        = {{ .Values.store.warc }}
    base_prefix = {{ .Values.store.basePrefix | quote }}

    [store.backend]
    kind = {{ .Values.store.backend.kind | quote }}
    {{- if eq .Values.store.backend.kind "local" }}
    path = {{ .Values.store.backend.path | quote }}
    {{- else if eq .Values.store.backend.kind "s3" }}
    {{- with .Values.store.backend.s3 }}
    bucket                       = {{ .bucket | quote }}
    region                       = {{ .region | quote }}
    {{- if .endpoint }}
    endpoint                     = {{ .endpoint | quote }}
    {{- end }}
    allow_http                   = {{ .allowHttp }}
    virtual_hosted_style_request = {{ .virtualHostedStyleRequest }}
    # access_key_id / secret_access_key arrive via env (the Secret).
    {{- end }}
    {{- end }}

    [server]
    listen = {{ .Values.server.listen | quote }}

    [sharding]
    num_shards = {{ printf "%d" (.Values.sharding.numShards | int64) }}
  {{- if .Values.seeds.content }}
  # Optional seed list. Mounted at /etc/crawlrs/seeds.txt and passed
  # to the binary as `--seeds /etc/crawlrs/seeds.txt` via the
  # StatefulSet args.
  seeds.txt: |
    {{- .Values.seeds.content | nindent 4 }}
  {{- end }}
