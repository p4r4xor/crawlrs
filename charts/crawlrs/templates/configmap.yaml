apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "crawlrs.configMapName" . }}
  labels:
    {{- include "crawlrs.labels" . | nindent 4 }}
data:
  # Rendered crawl.toml. Credentials (redis url, postgres url) are
  # placeholders here and overwritten via env-var overlay
  # (CRAWLRS_REDIS_URL, CRAWLRS_POSTGRES_URL) sourced from the Secret.
  # The binary's apply_env_overlay() makes the env values win.
  #
  # Type-coercion conventions used below:
  #
  #   `| quote`    - every string field. TOML requires strings be
  #                  quoted; without it, `default_timeout = 30s` is
  #                  rejected by the TOML parser.
  #   `| int64`    - every int field. Helm parses YAML numbers as
  #                  float64; without the cast, any int >= 10^6 hits
  #                  Go's float-formatter scientific-notation
  #                  threshold (5242880 -> 5.24288e+06) and breaks
  #                  TOML parsing. Defensive: small ints don't trip
  #                  this today, but a future operator bumping
  #                  `workers:` to 5_000_000 would silently break.
  #   `| float64`  - every float field. Marker-only at current values
  #                  (renders the same as plain), but documents the
  #                  type contract for the reader.
  #   plain        - bool fields. Sprig doesn't ship a `toBool`
  #                  coercion; rolling our own would mishandle
  #                  ambiguous strings like `"no"` (truthy by Go
  #                  template rules even though semantically false).
  #                  Canonical YAML `true`/`false` renders correctly
  #                  without a cast; the binary's TOML parser
  #                  rejects anything else at startup.
  crawl.toml: |
    run_id = {{ .Values.runId | quote }}

    [redis]
    url = {{ .Values.redis.url | quote }}
    pool_size = {{ .Values.redis.poolSize | int64 }}

    [postgres]
    url = {{ .Values.postgres.url | quote }}
    pool_size = {{ .Values.postgres.poolSize | int64 }}

    [fetch]
    max_body_bytes  = {{ .Values.fetch.maxBodyBytes | int64 }}
    user_agent      = {{ .Values.fetch.userAgent | quote }}
    default_timeout = {{ .Values.fetch.defaultTimeout | quote }}

    [politeness]
    min_delay        = {{ .Values.politeness.minDelay | quote }}
    honor_robots_txt = {{ .Values.politeness.honorRobotsTxt }}
    robots_cache_ttl = {{ .Values.politeness.robotsCacheTtl | quote }}

    [politeness.backoff]
    initial_backoff             = {{ .Values.politeness.backoff.initialBackoff | quote }}
    max_backoff                 = {{ .Values.politeness.backoff.maxBackoff | quote }}
    multiplier                  = {{ .Values.politeness.backoff.multiplier | float64 }}
    circuit_open_after_failures = {{ .Values.politeness.backoff.circuitOpenAfterFailures | int64 }}

    [runtime]
    workers          = {{ .Values.runtime.workers | int64 }}
    {{- if .Values.runtime.maxDepth }}
    max_depth        = {{ .Values.runtime.maxDepth | int64 }}
    {{- end }}
    max_retries      = {{ .Values.runtime.maxRetries | int64 }}
    cross_run_dedup  = {{ .Values.runtime.crossRunDedup }}
    link_dispatch    = {{ .Values.runtime.linkDispatch | quote }}

    [store]
    parquet     = {{ .Values.store.parquet }}
    warc        = {{ .Values.store.warc }}
    base_prefix = {{ .Values.store.basePrefix | quote }}

    [store.backend]
    kind = {{ .Values.store.backend.kind | quote }}
    {{- if eq .Values.store.backend.kind "local" }}
    path = {{ .Values.store.backend.path | quote }}
    {{- else if eq .Values.store.backend.kind "s3" }}
    {{- with .Values.store.backend.s3 }}
    bucket                       = {{ .bucket | quote }}
    region                       = {{ .region | quote }}
    {{- if .endpoint }}
    endpoint                     = {{ .endpoint | quote }}
    {{- end }}
    allow_http                   = {{ .allowHttp }}
    virtual_hosted_style_request = {{ .virtualHostedStyleRequest }}
    # access_key_id / secret_access_key arrive via env (the Secret).
    {{- end }}
    {{- end }}

    [server]
    listen = {{ .Values.server.listen | quote }}

    [sharding]
    num_shards = {{ .Values.sharding.numShards | int64 }}
  {{- if .Values.seeds.content }}
  # Optional seed list. Mounted at /etc/crawlrs/seeds.txt and passed
  # to the binary as `--seeds /etc/crawlrs/seeds.txt` via the
  # StatefulSet args.
  seeds.txt: |
    {{- .Values.seeds.content | nindent 4 }}
  {{- end }}
