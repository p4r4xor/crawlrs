{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "crawlrs.secretName" . }}
  labels:
    {{- include "crawlrs.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Operators wanting external secret management should set
  # `secrets.create: false` and `secrets.existingSecret: <name>`.
  # The Secret must expose the same key names this template defines.
  redisUrl: {{ .Values.secrets.values.redisUrl | quote }}
  postgresUrl: {{ .Values.secrets.values.postgresUrl | quote }}
  {{- if eq .Values.store.backend.kind "s3" }}
  s3AccessKeyId: {{ .Values.secrets.values.s3AccessKeyId | quote }}
  s3SecretAccessKey: {{ .Values.secrets.values.s3SecretAccessKey | quote }}
  {{- end }}
{{- end }}
